<title>일기장 조각 맞추기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 한 화면 앱: 먹빛 방 안, 촛불에 비친 한지 문서와 벽에 걸린 그림 */
:root{
  --ink:#0d0b09;--ink-2:#18140f;--paper:#e6d7b6;--paper-dim:#b9a985;
  --text-on-ink:#d9cbb0;--muted:#8a7c66;--seal:#a8231b;--candle:#d79b3a;--ok:#5f8a4a;--line:#3a3127;
  --f-display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(215,155,58,.13),transparent 70%),radial-gradient(ellipse 120% 80% at 50% 120%,rgba(0,0,0,.8),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;
  display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seals{display:flex;gap:6px}
.seal{width:30px;height:30px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--muted);background:var(--ink-2)}
.seal.done{background:var(--seal);border-color:var(--seal);color:var(--paper)}
.seal.now{border-color:var(--candle);color:var(--candle)}
.clock{font-variant-numeric:tabular-nums;font-size:22px;letter-spacing:.04em;color:var(--candle);display:flex;align-items:baseline;gap:8px}
.clock small{font-size:13px;color:var(--seal);letter-spacing:0}
.sheet{background:var(--paper);color:#2a221a;padding:26px 22px;position:relative;
  box-shadow:0 0 0 1px #6b5a3e,0 18px 50px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(90deg,rgba(120,95,55,.05) 0 2px,transparent 2px 7px),radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.25),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(90,60,20,.18),transparent 55%)}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(70,45,15,.35)}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--seal);font-weight:700}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(34px,8vw,52px);color:var(--paper)}
h2{font-size:clamp(25px,6vw,33px)}
h3{font-size:21px}
.hanja{font-family:var(--f-display);color:var(--seal);font-size:20px;letter-spacing:.3em;margin-top:4px}
.story{color:#4a3d2e;margin:10px 0 0}
.task{font-size:19px;font-weight:700;margin:16px 0 10px;line-height:1.5}
.feedback{min-height:1.6em;margin-top:10px;font-weight:700}
.feedback.bad{color:var(--seal)} .feedback.good{color:#3e6a2c}
.btn{font:inherit;font-size:18px;font-weight:700;padding:14px 22px;cursor:pointer;background:var(--seal);color:var(--paper);border:none;letter-spacing:.05em}
.btn.ghost{background:transparent;color:var(--text-on-ink);border:1px solid var(--line);font-weight:400;font-size:15px;padding:10px 14px}
.btn.dark{background:#2a221a;color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:15px;color:#4a3d2e;display:block;margin-bottom:6px}
input[type=text]{font:inherit;font-size:18px;padding:12px 14px;width:100%;background:rgba(255,250,235,.7);border:1.5px solid #8d7a58;color:#2a221a}
.rules{margin:16px 0;padding:0;list-style:none;display:grid;gap:8px}
.rules li{padding-left:22px;position:relative}
.rules li::before{content:"";position:absolute;left:4px;top:.65em;width:8px;height:8px;background:var(--seal);transform:rotate(45deg)}
button:focus-visible,input:focus-visible,.hot:focus-visible{outline:3px solid var(--candle);outline-offset:2px}
/* 벽에 걸린 그림 + 숨은 지점 */
.scene{position:relative;margin:14px 0 0;border:6px solid #3a2c1c;box-shadow:inset 0 0 0 1px #8d7a58,0 6px 16px rgba(0,0,0,.35);background:#1a140e;max-width:100%}
.scene img{display:block;width:100%;height:auto;filter:sepia(.25) contrast(1.03);user-select:none;-webkit-user-drag:none}
.scene .hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer}
.scene .hot.found{outline:3px solid var(--seal);outline-offset:-3px;background:rgba(168,35,27,.15)}
.scene .hot.found::after{content:"✓";position:absolute;right:-8px;top:-10px;width:24px;height:24px;background:var(--seal);color:var(--paper);display:grid;place-items:center;font-size:14px}
.scene .miss{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--paper);pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.scene figcaption{font-size:13px;color:var(--paper-dim);padding:6px 10px;background:#1a140e}
.thumb{border:4px solid #3a2c1c;background:#1a140e;display:block;max-width:100%}
.thumb img{display:block;width:100%;height:auto;filter:sepia(.25)}
/* 연표 */
.scroll{display:flex;overflow-x:auto;padding:4px 0 8px}
.tl{flex:1 0 0;min-width:96px;border-top:2px solid var(--line);padding-top:10px;position:relative;text-align:center}
.tl::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;background:var(--ink-2);border:2px solid var(--line);transform:rotate(45deg)}
.tl.on{border-top-color:var(--seal)} .tl.on::before{background:var(--seal);border-color:var(--seal)}
.tl .y{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.tl .e{font-family:var(--f-display);font-size:16px;color:var(--muted)}
.tl.on .y{color:var(--candle)} .tl.on .e{color:var(--paper)}
/* 순서 맞추기 */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.slot{min-height:64px;border:1.5px dashed #8d7a58;display:grid;place-items:center;text-align:center;padding:6px;font-family:var(--f-display);font-size:17px;color:#2a221a}
.slot .n{font-family:var(--f-body);font-size:12px;color:#6b5a44;display:block}
.slot.filled{border-style:solid;background:rgba(255,250,235,.6)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{font:inherit;font-family:var(--f-display);font-size:18px;padding:12px 16px;cursor:pointer;background:#2a221a;color:var(--paper);border:1px solid #6b5a3e}
.card:disabled{opacity:.25;cursor:default}
.card.sel{background:var(--seal);border-color:var(--seal)}
/* 탈출 기록 */
.big{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:clamp(56px,16vw,96px);color:var(--seal);line-height:1}
.stamp{display:inline-grid;place-items:center;width:92px;height:92px;border:4px solid var(--seal);color:var(--seal);font-family:var(--f-display);font-size:26px;transform:rotate(-8deg);line-height:1.1;text-align:center;flex:none}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0;font-variant-numeric:tabular-nums}
.meta dt{color:#6b5a44} .meta dd{margin:0;font-weight:700}
.note{font-size:14px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(5,4,3,.85);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.overlay .sheet{max-width:440px;width:100%}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fade{animation:fade .5s ease-out}
@keyframes fade{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.flicker{animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.85}50%{opacity:1}72%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.shake,.fade,.flicker,.boom,.scene .miss{animation:none}}
@media (max-width:480px){.sheet{padding:20px 14px}.task{font-size:17px}}

/* 일기장 전용 */
:root{--f-gung:"Gungsuh","궁서","GungSeo","궁서체","Song Myung","Nanum Myeongjo",serif;--f-hand:var(--f-gung);--f-display:var(--f-gung)}
.diary{background:#efe2c2;color:#2a1f14;padding:22px 20px 18px 26px;position:relative;
  box-shadow:0 0 0 1px #6b5a3e,0 18px 50px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,90,50,.22) 37px 38px)}
.diary::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(#5a3a1c 0 14px,transparent 14px 26px)}
.diary .date{font-family:var(--f-display);color:var(--seal);font-size:18px}
.diary .body{font-family:var(--f-hand);font-size:22px;line-height:38px;margin-top:6px;letter-spacing:.02em}
.blank{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--seal);text-align:center;color:var(--seal);padding:0 4px;line-height:30px}
.blank.cur{background:rgba(215,155,58,.35)}
.blank.filled{border-bottom-color:transparent;background:rgba(168,35,27,.08)}
.sent{font:inherit;color:inherit;background:none;border:0;padding:0 2px;cursor:pointer;text-align:left;display:inline;line-height:inherit}
.sent:hover,.sent:focus-visible{background:rgba(215,155,58,.3);outline:none}
.sent.no{text-decoration:line-through;text-decoration-color:rgba(168,35,27,.5);cursor:default;background:none}
.sent.fixed{color:#2f5a2a;background:rgba(95,138,74,.15)}
.forged{background:rgba(168,35,27,.15);text-decoration:line-through;text-decoration-color:var(--seal)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.word{font:inherit;font-family:var(--f-display);font-size:19px;padding:10px 14px;cursor:pointer;background:#2a221a;color:var(--paper);border:1px solid #6b5a3e;transform:rotate(-1deg)}
.word:nth-child(even){transform:rotate(1.2deg)}
.word:disabled{opacity:.25;cursor:default}
.blot{position:fixed;inset:0;pointer-events:none;z-index:30;display:grid;place-items:center}
.blot i{width:180px;height:160px;background:#111;border-radius:48% 52% 45% 55%/55% 45% 58% 42%;opacity:0;animation:blot .7s ease-out}
@keyframes blot{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}
.cover{background:#3b2414;border:3px solid #6b4a2a;padding:30px 22px;text-align:center;color:#e8d3a8;box-shadow:0 18px 50px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 4px,transparent 4px 9px)}
.cover h1{color:#f0dcb0}
.cover .lbl{display:inline-block;margin-top:12px;border:2px solid #c9a66b;padding:6px 14px;font-family:var(--f-display);font-size:20px}
.pages-done{display:flex;gap:6px;align-items:center}
.pg{width:26px;height:34px;border:1.5px solid var(--line);background:var(--ink-2);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--seal)}
.pg.done{background:#efe2c2;border-color:#efe2c2}
.pg.now{border-color:var(--candle)}
.steps{display:flex;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 8px;border:1px solid var(--line)}
.steps span.on{color:var(--candle);border-color:var(--candle)}
.steps span.ok{color:var(--paper);background:var(--seal);border-color:var(--seal)}
.fixopts{display:grid;gap:8px;margin-top:12px}
.fixopt{font:inherit;font-family:var(--f-hand);font-size:19px;text-align:left;padding:10px 14px;cursor:pointer;background:#2a221a;color:var(--paper);border:1px solid #6b5a3e}
.book{display:grid;gap:14px}
.mini{font-family:var(--f-hand);font-size:18px;line-height:30px;background:#efe2c2;color:#2a1f14;padding:12px 14px;border-left:6px solid #5a3a1c}
.mini b{font-family:var(--f-display);font-weight:400;color:var(--seal);font-size:17px;display:block;line-height:1.4}
.glow{outline:4px solid var(--candle)!important;outline-offset:2px;animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{outline-color:transparent}}
#hintbtn{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:17px;font-weight:700;padding:12px 18px;cursor:pointer;background:var(--candle);color:#1a120a;border:0;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.clock.hurry{color:var(--seal)}
#hintnote{position:fixed;z-index:14;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;background:#2a1f14;color:var(--paper);border:2px solid var(--candle);padding:12px 14px;font-size:16px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#hintbtn{z-index:16}
.wrap{padding-bottom:110px!important}
.card .evline{display:block;font-family:var(--f-body);font-size:13px;color:var(--candle);margin-top:4px;line-height:1.35}
.card:disabled .evline{color:inherit}
.wrap{max-width:1100px}
body{font-size:19px}
.diary .body{font-size:clamp(24px,2.4vw,32px)!important;line-height:44px!important}
.classes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.clsbtn{font:inherit;font-family:var(--f-display);font-size:30px;padding:14px 8px;cursor:pointer;background:#2a221a;color:var(--paper);border:2px solid #6b5a3e;display:grid;gap:2px;justify-items:center}
.clsbtn small{font-family:var(--f-body);font-size:13px;color:var(--paper-dim)}
.clsbtn.on{background:var(--seal);border-color:var(--seal)}
.clsbtn:focus-visible{outline:3px solid var(--candle);outline-offset:2px}
table.rec{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px;color:#2a221a}
table.rec th,table.rec td{padding:8px 10px;border-bottom:1px solid rgba(90,70,40,.25);text-align:left;white-space:nowrap}
table.rec th{font-size:13px;color:#6b5a44;font-weight:400}
table.rec tr.me td{background:rgba(168,35,27,.12);font-weight:700}
@media (max-width:520px){.classes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.gcard{background:var(--paper);color:#2a221a;padding:12px;display:grid;gap:8px;box-shadow:0 0 0 1px #6b5a3e,0 10px 30px rgba(0,0,0,.5)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.gn{font-family:var(--f-display);font-size:28px;color:var(--seal)}
.gl{font-size:14px;color:#6b5a44}.gl b{color:var(--seal);font-size:18px}
.qrbox{background:#fff;padding:8px;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;max-width:220px}
.gm{font:inherit;font-size:14px;width:100%;resize:vertical;background:rgba(255,250,235,.7);border:1px solid #8d7a58;color:#2a221a;padding:6px}
.slots5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;max-width:900px;margin:0 auto;width:100%}
.slot5{border:3px dashed #6b5a3e;display:grid;justify-items:center;padding:14px 6px;gap:6px;background:var(--ink-2)}
.slot5 .sg{font-size:15px;color:var(--muted)}
.slot5 .sl{font-family:var(--f-display);font-size:clamp(56px,9vw,110px);color:var(--muted);line-height:1}
.slot5.on{border-style:solid;border-color:var(--seal);background:#2a1712}
.slot5.on .sl{color:var(--paper);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 0 18px rgba(168,35,27,.7)}
@media (max-width:1000px){.gcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.gcards{grid-template-columns:1fr 1fr}.slots5{gap:6px}}
.sumline{font-size:14px;color:#6b5a44;margin:6px 0 0}
.redch{color:var(--seal);font-family:var(--f-display);font-size:1.15em}
/* 암호 */
.code{display:flex;gap:8px;justify-content:center;margin:14px 0}
.code .c{width:58px;height:66px;border:2px dashed #8d7a58;display:grid;place-items:center;font-family:var(--f-display);font-size:36px;color:var(--seal);background:rgba(255,250,235,.5)}
.code .c.f{border-style:solid}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{font:inherit;font-family:var(--f-display);font-size:34px;width:60px;height:66px;cursor:pointer;background:var(--seal);color:var(--paper);border:0}
.tile:disabled{opacity:.2;cursor:default}

/* 마지막 기쁨 장면 */
.joy{position:fixed;inset:0;z-index:40;background:#050403;display:grid;place-items:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.joy-glow{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 42%,rgba(255,196,96,.55),rgba(215,155,58,.18) 32%,rgba(5,4,3,0) 62%);opacity:0;animation:jglow 2s ease-out .2s forwards}
@keyframes jglow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.joy-inner{position:relative;display:grid;justify-items:center;gap:12px;text-align:center;max-width:560px}
.joy-book{position:relative;width:min(300px,72vw);height:90px;margin-bottom:-56px;perspective:900px}
.joy-book .pg{position:absolute;top:0;width:50%;height:100%;background:#efe2c2;box-shadow:0 10px 30px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(transparent 0 13px,rgba(120,90,50,.25) 13px 14px)}
.joy-book .l{left:0;transform-origin:right center;transform:rotateY(90deg);animation:openl .9s ease-out .3s forwards}
.joy-book .r{right:0;transform-origin:left center;transform:rotateY(-90deg);animation:openr .9s ease-out .3s forwards}
@keyframes openl{to{transform:rotateY(0)}} @keyframes openr{to{transform:rotateY(0)}}
.joy-king{width:min(190px,46vw);aspect-ratio:368/472;max-width:100%;border:5px solid var(--candle);background:#f6efe2;overflow:hidden;
  box-shadow:0 0 0 3px #3a2c1c,0 0 40px rgba(255,196,96,.6);opacity:0;transform:translateY(40px) scale(.7);
  animation:kingin .7s cubic-bezier(.3,1.5,.5,1) 1.1s forwards, hop 1.1s ease-in-out 2.2s 3}
.joy-king img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes kingin{to{opacity:1;transform:none}}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-16px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.joy-say{position:relative;background:#fffaf0;color:#2a1f14;font-family:var(--f-hand);font-size:clamp(22px,5.4vw,30px);padding:12px 18px;border:2px solid #2a1f14;border-radius:18px;
  opacity:0;transform:scale(.6);animation:pop .45s cubic-bezier(.3,1.6,.5,1) 1.9s forwards}
.joy-say::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:#2a1f14;border-top:0}
@keyframes pop{to{opacity:1;transform:none}}
.joy-say2{color:var(--paper);font-family:var(--f-hand);font-size:clamp(17px,4vw,21px);opacity:0;animation:up .7s ease-out 2.7s forwards}
.joy-line{color:var(--candle);font-size:15px;opacity:0;animation:up .7s ease-out 3.3s forwards;text-wrap:balance}
.joy-btn{opacity:0;animation:up .5s ease-out 3.8s forwards}
.petal{position:absolute;top:-24px;width:14px;height:12px;background:#f4b6c2;border-radius:70% 0 70% 0;opacity:0;animation-name:petal;animation-timing-function:linear;animation-iteration-count:infinite;box-shadow:inset -2px -2px 0 rgba(200,90,120,.35)}
@keyframes petal{0%{opacity:0;translate:0 0;rotate:0deg}8%{opacity:.95}100%{opacity:.2;translate:60px 108vh;rotate:540deg}}
@media (prefers-reduced-motion:reduce){
  .joy-glow,.joy-book .pg,.joy-king,.joy-say,.joy-say2,.joy-line,.joy-btn{animation:none;opacity:1;transform:none}
  .petal{display:none}
}
/* 장 넘김 연출 */
.chap{position:fixed;inset:0;z-index:40;background:#050403;display:grid;place-items:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chap .ink{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;border-radius:50%;
  background:radial-gradient(circle,#1a1410 0,#0d0a08 45%,#050403 70%);transform:scale(0);animation:ink 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ink{to{transform:scale(1)}}
.chap .leaf{position:absolute;inset:8% 12%;background:#efe2c2;transform-origin:left center;box-shadow:0 20px 60px rgba(0,0,0,.7);
  background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,90,50,.22) 37px 38px);
  animation:leaf 1.1s ease-in forwards}
@keyframes leaf{0%{transform:perspective(1400px) rotateY(0)}100%{transform:perspective(1400px) rotateY(-100deg);opacity:0}}
.chap .inner{position:relative;text-align:center;display:grid;gap:14px;justify-items:center;max-width:100%}
.chap .gotlbl{color:var(--paper-dim);font-size:15px;letter-spacing:.2em;opacity:0;animation:up .6s ease-out 1.1s forwards}
.chap .got{width:120px;height:120px;border:5px solid var(--seal);color:var(--seal);font-family:var(--f-display);font-size:78px;display:grid;place-items:center;
  transform:scale(2.4) rotate(-14deg);opacity:0;animation:stamp .45s cubic-bezier(.3,1.6,.5,1) 1.5s forwards;text-shadow:0 0 18px rgba(168,35,27,.6)}
@keyframes stamp{to{transform:scale(1) rotate(-6deg);opacity:1}}
.chap .yr{font-family:var(--f-display);color:var(--candle);font-size:clamp(46px,13vw,104px);letter-spacing:.6em;line-height:1;opacity:0;animation:yr 1s ease-out 2.4s forwards;font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes yr{from{opacity:0;letter-spacing:.6em;filter:blur(6px)}to{opacity:1;letter-spacing:.08em;filter:blur(0)}}
.chap .ttl{font-family:var(--f-display);color:var(--paper);font-size:clamp(26px,6vw,40px);opacity:0;animation:up .7s ease-out 3.1s forwards;text-wrap:balance}
.chap .sub{color:var(--paper-dim);opacity:0;animation:up .7s ease-out 3.4s forwards}
.chap .btn{opacity:0;animation:up .5s ease-out 3.8s forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ember{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--candle);box-shadow:0 0 8px var(--candle);opacity:0;animation:ember 4s linear infinite}
@keyframes ember{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}100%{opacity:0;transform:translateY(-95vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){
  .chap .ink,.chap .leaf,.ember{animation:none}.chap .leaf{display:none}.chap .ink{transform:none}
  .chap .gotlbl,.chap .got,.chap .yr,.chap .ttl,.chap .sub,.chap .btn{animation:none;opacity:1;transform:none;filter:none;letter-spacing:.08em}
}
@media (max-width:480px){.diary .body{font-size:19px;line-height:34px}.code .c{width:48px;height:56px;font-size:30px}.tile{width:52px;height:58px;font-size:30px}}

  spot:[53.6,71.5,19.6,20.6], decoys:[[53.0,43.9,18.6,21.0],[61.0,7.3,15.2,22.5],[30.4,45.3,19.8,26.2]],
  body:["청일 전쟁으로 힘이 세진 일본은 [갑오개혁]을 밀어붙였다.","1895년에는 일본이 왕비를 해쳤다. [을미사변]이다.","나는 새벽에 궁녀의 가마를 타고 궁궐을 빠져나와 [러시아 공사관]으로 몸을 옮겼다.","{F}","훗날 사람들은 이를 [아관파천]이라 부르리라."],
  bad:"러시아의 힘으로 청을 견제하려는 것이다.",

  wrongFix:["러시아의 힘으로 미국을 견제하려는 것이다.","일본의 힘으로 러시아를 견제하려는 것이다."],
  extra:["갑신개혁","을사사변","일본 공사관","러관파천"]}
];
PAGES.forEach(function(p){p.words=[];p.body.forEach(function(s){s.replace(/\[([^\]]+)\]/g,function(_,w){p.words.push(w)})})});
var PHASES=[["find","찾기"],["fill","채우기"],["fix","바로잡기"]];
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).split("").reverse().join("").replace(/=/g,"")}
function dec(t){try{t=t.split("").reverse().join("");while(t.length%4)t+="=";return JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e){return null}}
var T=(function(){try{var q=new URLSearchParams(location.search).get("t")||(location.hash.indexOf("#t")===0?location.hash.slice(2):"");if(!q)return null;var o=dec(q);if(o&&o.g&&o.c!=null&&o.l)return o}catch(e){}return null})();
if(T)KEY=KEY+"-"+T.k+"-"+T.g;

function blank(){return {stage:"intro",name:T?T.g+"모둠":"",limit:15,wrongBy:{},missWord:{},page:T?T.c:0,start:0,end:0,penalty:0,wrong:0,phase:"chap",filled:0,fixStep:0,fixOpts:null,bind:[],deck:null,code:[],tiles:null,miss:0,mkey:""}}
var S=(function(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stage)return s}catch(e){}return blank()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var app=document.getElementById("app"),modal=document.getElementById("modal");
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),x=s%60;return(m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function elapsed(){return((S.end||Date.now())-S.start)/1000+S.penalty}
function fb(cls,t){var f=$("fb");if(f){f.className="feedback "+cls;f.textContent=t}}
function each(sel,fn){Array.prototype.forEach.call(app.querySelectorAll(sel),fn)}
function blotFx(){var x=document.createElement("div");x.className="blot";x.innerHTML="<i></i>";document.body.appendChild(x);setTimeout(function(){x.remove()},750)}
function penalize(t){
  if(S.phase==="fill"&&S.filled>=PAGES[S.page].words.length)return;
  S.wrongBy=S.wrongBy||{};S.missWord=S.missWord||{};S.wrongBy[S.phase]=(S.wrongBy[S.phase]||0)+1;
  var pp=PAGES[S.page],wk=S.phase==="fill"?"빈칸 ‘"+pp.words[S.filled]+"’":S.phase==="fix"?"거짓 문장 바로잡기":S.phase==="find"?"그림 속 숨은 곳 찾기":"";
  if(wk)S.missWord[wk]=(S.missWord[wk]||0)+1;
  S.penalty+=PEN;S.wrong++;S.miss=(S.miss||0)+1;save();showHint();var sh=$("sh");if(sh){sh.classList.remove("shake");void sh.offsetWidth;sh.classList.add("shake")}fb("bad",t);clock()}
var HINT=null;
var HINT_AT=[3,6],MAX_REVEAL=3;
function showHint(){
  var lv=S.hlv||0;if(lv>=2||!HINT||$("hintbtn"))return;
  if((S.miss||0)<HINT_AT[lv])return;
  var left=MAX_REVEAL-(S.reveals||0);
  if(lv===1&&left<=0)return;
  var b=document.createElement("button");b.id="hintbtn";b.textContent=lv===0?"힌트 1 보기":"정답 힌트 보기 (남은 "+left+"번)";
  var nt=$("hintnote");if(nt)b.style.bottom=(nt.offsetHeight+28)+"px";
  b.onclick=function(){if(!HINT)return;S.hlv=(S.hlv||0)+1;if(S.hlv===2)S.reveals=(S.reveals||0)+1;save();b.remove();HINT(S.hlv);};
  document.body.appendChild(b);
}
function note(t){S.htxt=t;save();drawNote()}
function drawNote(){var o=$("hintnote");if(o)o.remove();if(!S.htxt||!live())return;var d=document.createElement("div");d.id="hintnote";d.textContent=S.htxt;document.body.appendChild(d)}
function where(r){var cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;return (cy<36?"위쪽":cy<64?"가운데":"아래쪽")+" "+(cx<36?"왼편":cx<64?"가운데":"오른편")}
function glowEl(el,msg){if(el){el.classList.add("glow");try{el.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}}fb("",msg)}
var LIMIT=15*60;
function lim(){return 86400}
function remain(){return lim()-((S.end||Date.now())-S.start)/1000-S.penalty}
function progress(){
  if(S.stage==="done")return 100;if(S.stage==="intro"||S.stage==="rules")return 0;
  if(S.stage==="timeout")return S.timeoutPct||0;
  var pct=(S.stage==="play"?S.page:PAGES.length)*18;
  if(S.stage==="play"){var p=PAGES[S.page];
    if(S.phase==="fill"||S.phase==="fix")pct+=4;
    if(S.phase==="fill")pct+=8*S.filled/p.words.length;
    if(S.phase==="fix")pct+=8+(S.fixStep===1?3:0);}
  if(S.stage==="code")pct+=5;
  return Math.floor(pct);
}
function live(){return S.stage==="play"||S.stage==="bind"||S.stage==="code"}
function clock(){
  var c=$("clk");if(c)c.textContent=fmt(((S.end||Date.now())-S.start)/1000);
  var s=$("pen");if(s)s.textContent=S.wrong;
}
function timeUp(){
  S.timeoutPct=progress();S.timeoutPage=S.stage==="play"?S.page:PAGES.length;S.end=Date.now();S.stage="timeout";save();
  modal.innerHTML="";var hb=$("hintbtn");if(hb)hb.remove();render();
}
setInterval(function(){if(live()){if(remain()<=0)timeUp();else clock()}},500);

function bar(){
  var p=PAGES[S.page];
  var steps='<div class="steps">'+PHASES.map(function(ph,i){var cur=PHASES.map(function(x){return x[0]}).indexOf(S.phase);return '<span class="'+(i<cur?"ok":(i===cur?"on":""))+'">'+ph[1]+'</span>'}).join("")+'</div>';
  return '<div class="bar"><div style="display:grid;gap:6px"><div class="eyebrow" style="color:var(--candle)">'+esc(S.name)+' · '+esc(p.chap)+'</div>'+steps+'</div>'+
   '<div style="display:grid;justify-items:end;gap:2px"><div class="clock flicker"><span style="font-size:13px;color:var(--muted)">걸린 시간</span><span id="clk">'+fmt(((S.end||Date.now())-S.start)/1000)+'</span></div>'+
   '<div style="font-size:13px;color:var(--muted)">틀린 횟수 <b id="pen" style="color:var(--seal)">'+S.wrong+'</b></div></div></div>';
}
/* 본문 그리기. mode: fill(빈칸) / fix(문장 버튼) / done */
function bodyHTML(p,mode,n){
  var bi=0;
  return p.body.map(function(sent,si){
    if(sent==="{F}"){
      if(mode==="done")return '<span class="sent fixed">'+esc(p.good)+'</span>';
      if(mode==="fix")return '<button class="sent" data-s="F">'+esc(p.bad)+'</button>';
      return '<span>'+esc(p.bad)+'</span>';
    }
    var html=esc(sent).replace(/\[([^\]]+)\]/g,function(_,w){
      var k=bi++;
      if(mode!=="fill"||k<n)return '<span class="blank filled">'+w+'</span>';
      return '<span class="blank'+(k===n?" cur":"")+'">&nbsp;</span>';
    });
    if(mode==="fix")return '<button class="sent" data-s="'+si+'">'+html+'</button>';
    return '<span>'+html+'</span>';
  }).join(" ");
}

function loadRec(){try{return JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){return []}}
function saveRec(r){try{localStorage.setItem(RKEY,JSON.stringify(r))}catch(e){}}
function addRecord(pct){
  if(S.recSaved)return;var r=loadRec();
  r.push({cls:S.name,pct:pct,remain:Math.max(0,Math.round(remain())),wrong:S.wrong,limit:S.limit||15,at:Date.now()});
  saveRec(r);S.recSaved=true;save();
}
function recBoard(hi){
  var r=loadRec().slice().sort(function(a,b){return b.pct-a.pct||b.remain-a.remain});
  if(!r.length)return '<p class="note" style="margin:0">아직 기록이 없습니다. 첫 번째 반이 되어 보세요.</p>';
  return '<div style="overflow-x:auto"><table class="rec"><thead><tr><th>순위</th><th>반</th><th>되살린 정도</th><th>남은 시간</th><th>틀린 횟수</th><th>날짜</th></tr></thead><tbody>'+
   r.map(function(x,i){var d=new Date(x.at);return '<tr'+(hi&&x.at===hi?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(x.cls)+'</td><td>'+x.pct+'%</td><td>'+fmt(x.remain)+' <span class="note">/ '+x.limit+'분</span></td><td>'+x.wrong+'번</td><td>'+(d.getMonth()+1)+'/'+d.getDate()+'</td></tr>'}).join("")+'</tbody></table></div>';
}

   '<div class="row"><button class="btn" id="go">일기장을 펼친다</button></div></div></div>';
  $("go").onclick=function(){S.stage="play";S.phase="chap";S.start=Date.now();save();render()};

function renderChap(){
  var p=PAGES[S.page];
  app.innerHTML=bar();
  chapterFx({leaf:false,got:null,yr:p.date,ttl:p.chap+" · "+p.name,sub:p.sum,btn:"찾으러 간다",

function renderFind(){
  var p=PAGES[S.page];
  app.innerHTML=bar()+'<div class="sheet fade" id="sh"><div class="eyebrow">'+esc(p.chap)+' · 찢긴 장 찾기</div><h2>'+esc(p.name)+'</h2>'+
   '<p class="sumline">'+esc(p.sum)+'</p><p class="task">“'+esc(p.riddle)+'”</p>'+
   '<figure class="scene"><div id="sc" style="position:relative"><img src="'+IMG[p.img]+'" alt="'+esc(p.cap)+'"></div><figcaption>'+esc(p.cap)+'</figcaption></figure>'+
   '<div class="feedback" id="fb"></div></div>'+resetRow();
  var sc=$("sc");
  function addSpot(r,real){
    var b=document.createElement("button");b.className="hot";b.setAttribute("aria-label","그림 속 숨은 곳");
    b.style.left=r[0]+"%";b.style.top=r[1]+"%";b.style.width=r[2]+"%";b.style.height=r[3]+"%";
    b.onclick=function(e){e.stopPropagation();
      if(real){b.id="real";b.classList.add("found");fb("good","찢긴 일기장을 찾았다!");setTimeout(function(){S.phase="fill";S.filled=0;save();render()},800)}
      else{if(b.disabled)return;b.disabled=true;blotFx();penalize("위조된 쪽지다! 수수께끼를 다시 읽어라. "+PEN+"초가 깎였다.")}
    };
    sc.appendChild(b);
  }
  addSpot(p.spot,true);var rb=sc.querySelector(".hot");rb.id="real";rb.classList.remove("found");p.decoys.forEach(function(d){addSpot(d,false)});
  HINT=function(lv){if(lv<2)note("힌트 1: 그림의 "+where(p.spot)+" 쪽을 살펴보자.");else glowEl($("real"),"힌트 2: 빛나는 곳을 눌러 보자.")};
  sc.querySelector("img").onclick=function(e){
    var r=e.target.getBoundingClientRect(),m=document.createElement("span");m.className="miss";
    m.style.left=((e.clientX-r.left)/r.width*100)+"%";m.style.top=((e.clientY-r.top)/r.height*100)+"%";sc.appendChild(m);setTimeout(function(){m.remove()},700);
    fb("","여기엔 아무것도 없다.");
  };

function renderFill(){
  var p=PAGES[S.page],bank=shuffle(p.words.concat(p.extra));
  function draw(){
    app.innerHTML=bar()+'<div id="sh" class="fade"><div class="diary"><div class="date">'+esc(p.date)+'</div><div class="body">'+bodyHTML(p,"fill",S.filled)+'</div></div></div>'+
     '<div class="sheet" style="padding:16px 18px"><div class="eyebrow">낱말 도장 · 빛나는 빈칸부터 차례로</div><div class="words">'+
       bank.map(function(w,i){var used=p.words.slice(0,S.filled).indexOf(w)>=0;return '<button class="word" data-i="'+i+'" '+(used?"disabled":"")+'>'+esc(w)+'</button>'}).join("")+
     '</div><div class="feedback" id="fb"></div></div>'+resetRow();
    HINT=function(lv){var ans=p.words[S.filled];if(lv<2){note("힌트 1: 이 빈칸의 낱말은 ‘"+ans.charAt(0)+"’(으)로 시작하고, "+ans.replace(/ /g,"").length+"글자다.");return}var t=null;each(".word",function(b){if(!b.disabled&&bank[+b.getAttribute("data-i")]===ans)t=b});glowEl(t,"힌트 2: 빛나는 도장을 찍어 보자.")};
    showHint();
    each(".word",function(b){b.onclick=function(){
      var w=bank[+b.getAttribute("data-i")];
      if(w===p.words[S.filled]){S.filled++;S.miss=0;S.hlv=0;S.htxt="";drawNote();var hb=$("hintbtn");if(hb)hb.remove();save();
        if(S.filled>=p.words.length){draw();fb("good","글자가 되살아났다. 그런데 어딘가 이상한 문장이 있다…");setTimeout(function(){S.phase="fix";S.fixStep=0;S.fixOpts=null;save();render()},1500)}else draw();
      }else{blotFx();penalize("먹물이 번졌다. 그 자리에 들어갈 말이 아니다. "+PEN+"초가 깎였다.")}
    }});
    bindReset();
  }
  draw();
}

function renderFix(){
  var p=PAGES[S.page];
  if(!S.fixOpts){S.fixOpts=shuffle([p.good].concat(p.wrongFix));save()}
  if(S.fixStep===0){
    app.innerHTML=bar()+'<div id="sh" class="fade"><div class="diary"><div class="date">'+esc(p.date)+'</div><div class="body">'+bodyHTML(p,"fix")+'</div></div></div>'+
     '<div class="sheet" style="padding:16px 18px"><div class="eyebrow">바로잡기</div><p class="task" style="margin-top:6px">이 장에는 누군가 몰래 고쳐 쓴 <b style="color:var(--seal)">거짓 문장</b>이 하나 있다. 일기를 읽고 그 문장을 눌러라.</p><div class="feedback" id="fb"></div></div>'+resetRow();
    HINT=function(lv){var idx=p.body.indexOf("{F}"),half=idx<p.body.length/2?"앞쪽":"뒤쪽";if(lv<2){note("힌트 1: 거짓 문장은 일기의 "+half+" 절반에 있다. 나라 이름이나 행동이 수업 내용과 다른 문장을 찾아라.");return}glowEl(app.querySelector('.sent[data-s="F"]'),"힌트 2: 빛나는 문장이 거짓이다.")};

    return '<div class="slot5'+(on?" on":"")+'"><span class="sg">'+a.g+'모둠</span><span class="sl">'+(on?esc(ch):"?")+'</span></div>'}).join("");
  app.innerHTML='<div class="fade" style="display:grid;gap:22px;padding-top:1vh">'+
   '<div style="text-align:center"><div class="eyebrow" style="color:var(--candle)">3학년 6반 · 발표 · 단어 완성</div><h1 style="margin-top:6px">다섯 조각을 모아라</h1>'+
   '<p style="margin:8px auto 0;color:var(--paper-dim)">모둠이 어려웠던 문제를 발표하고 글자를 외치면, 그 모둠 버튼을 누르세요.</p></div>'+
   '<div class="slots5">'+slots+'</div>'+
   '<div class="row" style="justify-content:center;gap:12px">'+t.assign.map(function(a){var on=rv.indexOf(a.g)>=0;return '<button class="btn '+(on?"dark":"")+' gbtn" data-g="'+a.g+'" '+(on?"disabled":"")+'>'+a.g+'모둠 발표 완료</button>'}).join("")+'</div>'+
   (done?'<div class="sheet" style="text-align:center"><div class="eyebrow">비밀 단어 완성</div><div class="big" style="font-size:clamp(56px,10vw,110px);letter-spacing:.1em">외세의 간섭</div><p class="story" style="font-size:20px">문을 닫았다가, 열었고, 바꾸려 했지만, <b style="color:var(--seal)">외세가 끼어들었다.</b></p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="joy">고종에게 일기장 돌려주기</button></div></div>':'')+
   '<div class="row" style="justify-content:center;gap:10px"><button class="btn ghost" id="back">← QR 배정판으로</button><button class="btn ghost" id="undo">발표 되돌리기</button></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll(".gbtn"),function(b){b.onclick=function(){t.revealed=(t.revealed||[]).concat([+b.getAttribute("data-g")]);tSave(t);renderReveal(t)}});
  $("back").onclick=function(){t.view="deal";tSave(t);renderTeacher()};
  $("undo").onclick=function(){t.revealed=(t.revealed||[]).slice(0,-1);tSave(t);renderReveal(t)};
  if($("joy"))$("joy").onclick=function(){S.name="3학년 6반";joyFx(function(){renderReveal(t)})};
}
function render(){
  window.scrollTo(0,0);
  if(!T){renderTeacher();return}
  var hb=$("hintbtn");if(hb)hb.remove();HINT=null;
  var key=S.stage+"|"+S.page+"|"+S.phase+"|"+S.fixStep;if(S.mkey!==key){S.mkey=key;S.miss=0;S.hlv=0;S.htxt="";save()}
  if(live()&&remain()<=0){timeUp();return}
  if(S.stage==="letter"){renderLetter();return}
  if(S.stage==="intro")renderIntro();
  else if(S.stage==="timeout")renderTimeout();
  else if(S.stage==="play"){({chap:renderChap,find:renderFind,fill:renderFill,fix:renderFix})[S.phase]()}
  else if(S.stage==="bind")renderBind();
  else if(S.stage==="code")renderCode();
  else renderDone();
  drawNote();showHint();
}
render();
})();
</script>
