<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>흥부와 놀부 · 장면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4ead6;--muted:#c4b79e;--gold:#d6ad5c;--bg:#0b0907}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block}
#big{position:fixed;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(20,14,10,.62);border:1.5px solid rgba(244,234,214,.55);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}
#big.show{opacity:1;pointer-events:auto}
#big svg{width:34px;height:34px;fill:var(--ink)}
#ui{position:fixed;left:0;right:0;bottom:0;padding:30px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));transition:opacity .35s}
#ui.hide{opacity:0}
#bar{position:relative;height:6px;background:rgba(255,255,255,.2);border-radius:3px;cursor:pointer;touch-action:none}
#bar::before{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
#fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px;pointer-events:none}
.tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.6);pointer-events:none}
#row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1}
button:hover{background:rgba(255,255,255,.1)}
button svg{width:18px;height:18px;fill:currentColor;display:block}
.chap{font-size:14px;color:var(--muted);border-color:rgba(255,255,255,.16)}
.chap.on{color:#1b130c;background:var(--gold);border-color:var(--gold)}
#tm{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:92px}
#cc{font-size:13px;color:var(--muted);border-color:rgba(255,255,255,.16)}
.sp{flex:1}
.one-ch #chaps,.one-ch .tick,.one-ch #fsb{display:none}
@media (max-width:600px){.chap{padding:5px 7px;font-size:12px}#tm{min-width:0}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="big" title="재생"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
<div id="ui">
  <div id="bar"><div id="fill"></div></div>
  <div id="row">
    <button id="pp" title="재생/일시정지 (Space)"></button>
    <span id="tm">0:00 / 0:00</span>
    <div id="chaps"></div>
    <span class="sp"></span>
    <button id="cc" title="자막 (C)">자막 켜짐</button>
    <button id="fsb" title="전체 화면 (F)"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
  </div>
</div>
<script>
'use strict';
/* =========================================================
   흥부와 놀부 — 모든 그림과 움직임을 Canvas 코드로 직접 그림
   ========================================================= */
const W=1280,H=720,TAU=Math.PI*2,PI=Math.PI;
const cvs=document.getElementById('c');const ctx=cvs.getContext('2d');
let VS=1;
const F_SERIF='"Gowun Batang","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo","Malgun Gothic",serif';
const F_BRUSH='"Nanum Brush Script","Gowun Batang","Noto Serif CJK KR",serif';
const INK='#2a1d15', SK='#efc6a0', HAIR='#1c1917';

/* ---------- 수학 도우미 ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const seg=(t,a,b)=>sm((t-a)/(b-a));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
function kf(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++){const a=k[i],b=k[i+1];if(t<=b[0])return lerp(a[1],b[1],sm((t-a[0])/(b[0]-a[0])));}return k[k.length-1][1];}
function rng(seed){let s=seed*9301+49297;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function shade(h,a){let[r,g,b]=hexRGB(h);if(a<0){r*=1+a;g*=1+a;b*=1+a;}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}return`rgb(${r|0},${g|0},${b|0})`;}
function hexA(h,a){const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`;}
function easeBack(t){t=clamp(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}

/* ---------- 그리기 도우미 ---------- */
function E(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU);}
function C(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.abs(r),0,TAU);}
function fs(c){ctx.fillStyle=c;ctx.fill();}
function st(c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke();}
function RR(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function cam(cx,cy,z,rot){ctx.translate(W/2,H/2);ctx.scale(z,z);if(rot)ctx.rotate(rot);ctx.translate(-cx,-cy);}
function layer(k,camX,fn){ctx.save();ctx.translate((camX-640)*k,0);fn();ctx.restore();}

/* ---------- 종이 질감 · 비네팅 ---------- */
const paper=document.createElement('canvas');paper.width=W+64;paper.height=H+64;
(function(){const g=paper.getContext('2d');const r=rng(7);const img=g.createImageData(paper.width,paper.height);
for(let i=0;i<img.data.length;i+=4){const n=110+(r()*90|0);img.data[i]=n;img.data[i+1]=n;img.data[i+2]=n;img.data[i+3]=255;}
g.putImageData(img,0,0);g.strokeStyle='rgba(40,30,20,.5)';g.lineWidth=1;
for(let i=0;i<700;i++){const x=r()*paper.width,y=r()*paper.height,a=r()*TAU,l=6+r()*22;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+3,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}})();
const vign=document.createElement('canvas');vign.width=W;vign.height=H;
(function(){const g=vign.getContext('2d');const gr=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(20,10,0,.55)');g.fillStyle=gr;g.fillRect(0,0,W,H);})();

/* =========================================================
   배경 요소
   ========================================================= */
function sky(c1,c2,y1=0,y2=H){const g=ctx.createLinearGradient(0,y1,0,y2);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-900,-900,W+1800,H+1800);}
function ground(y,c1,c2){const g=ctx.createLinearGradient(0,y,0,H+60);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-900,y,W+1800,H-y+900);}
function ridge(seed,baseY,amp,col,al){const r=rng(seed);const ph=[r()*9,r()*9,r()*9],fr=[.0035+r()*.002,.009+r()*.004,.022+r()*.01];
  ctx.save();ctx.globalAlpha=al;const g=ctx.createLinearGradient(0,baseY-amp,0,baseY+140);g.addColorStop(0,col);g.addColorStop(1,hexA(col,0));ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-900,baseY+400);for(let x=-900;x<=W+900;x+=12){const y=baseY-amp*(.6*Math.sin(x*fr[0]+ph[0])+.28*Math.sin(x*fr[1]+ph[1])+.12*Math.sin(x*fr[2]+ph[2]))-amp*.3;ctx.lineTo(x,y);}
  ctx.lineTo(W+900,baseY+400);ctx.closePath();ctx.fill();ctx.restore();}

function giwaRoof(cx,y,w,h,col='#3b3f47'){
  const hw=w/2;ctx.save();
  const shape=()=>{ctx.beginPath();ctx.moveTo(cx-hw-24,y-30);ctx.quadraticCurveTo(cx-hw+50,y+6,cx,y+6);ctx.quadraticCurveTo(cx+hw-50,y+6,cx+hw+24,y-30);
    ctx.quadraticCurveTo(cx+hw*.86,y-h*.45,cx+hw*.7,y-h);ctx.lineTo(cx-hw*.7,y-h);ctx.quadraticCurveTo(cx-hw*.86,y-h*.45,cx-hw-24,y-30);ctx.closePath();};
  shape();const g=ctx.createLinearGradient(0,y-h,0,y);g.addColorStop(0,shade(col,-.25));g.addColorStop(1,shade(col,.08));ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2.2;
  for(let x=cx-hw-34;x<=cx+hw+34;x+=11){const tx=cx+(x-cx)*.7;ctx.beginPath();ctx.moveTo(tx,y-h);ctx.quadraticCurveTo(lerp(tx,x,.65),y-h*.4,x,y+8);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let x=cx-hw-34;x<=cx+hw+34;x+=11){const tx=cx+(x-cx)*.7+4;ctx.beginPath();ctx.moveTo(tx,y-h);ctx.quadraticCurveTo(lerp(tx,x+4,.65),y-h*.4,x+4,y+8);ctx.stroke();}
  ctx.restore();shape();st(INK,2.4);
  ctx.beginPath();ctx.moveTo(cx-hw-24,y-30);ctx.quadraticCurveTo(cx-hw+50,y+6,cx,y+6);ctx.quadraticCurveTo(cx+hw-50,y+6,cx+hw+24,y-30);st(shade(col,.35),3.5);
  ctx.beginPath();ctx.moveTo(cx-hw*.74-12,y-h-15);ctx.quadraticCurveTo(cx,y-h-4,cx+hw*.74+12,y-h-15);ctx.lineTo(cx+hw*.72,y-h+3);ctx.lineTo(cx-hw*.72,y-h+3);ctx.closePath();fs(shade(col,-.4));st(INK,2);
  ctx.beginPath();ctx.moveTo(cx-hw*.72,y-h-3);ctx.quadraticCurveTo(cx,y-h+4,cx+hw*.72,y-h-3);st('rgba(235,230,215,.5)',2);
  ctx.restore();}

function latticeDoor(x,y,w,h,lit){ctx.fillStyle=lit?'#f6e7bd':'#ece2c8';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#8b5e3c';ctx.lineWidth=1.1;ctx.beginPath();
  for(let i=x+8;i<x+w-2;i+=9){ctx.moveTo(i,y);ctx.lineTo(i,y+h);}for(let j=y+8;j<y+h-2;j+=9){ctx.moveTo(x,j);ctx.lineTo(x+w,j);}ctx.stroke();ctx.strokeStyle='#6e4126';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);}

function giwaHouse(cx,gy,w,bh,rh,o={}){
  const L=cx-w/2,n=o.bays||4,bw=w/n;
  ctx.fillStyle='#9b968b';ctx.fillRect(L-14,gy-20,w+28,20);ctx.strokeStyle='rgba(60,50,40,.5)';ctx.lineWidth=1;ctx.beginPath();for(let x=L-14;x<L+w+14;x+=34){ctx.moveTo(x,gy-20);ctx.lineTo(x,gy);}ctx.moveTo(L-14,gy-10);ctx.lineTo(L+w+14,gy-10);ctx.stroke();
  const top=gy-20-bh;ctx.fillStyle=o.wall||'#ebe2cd';ctx.fillRect(L,top,w,bh);
  for(let i=0;i<n;i++){const x=L+i*bw;
    if(o.open===i){ctx.fillStyle='#4a3424';ctx.fillRect(x+6,top+8,bw-12,bh-8);ctx.fillStyle='#6b4a30';ctx.fillRect(x+6,gy-34,bw-12,14);
      ctx.fillStyle='rgba(255,220,150,.18)';ctx.fillRect(x+6,top+8,bw-12,bh-8);}
    else latticeDoor(x+12,top+14,bw-24,bh-26,o.lit);}
  ctx.fillStyle='#7b4a2b';for(let i=0;i<=n;i++){const x=L+i*bw;ctx.fillRect(x-6,top,12,bh);}
  ctx.fillStyle='#5f3a22';ctx.fillRect(L-8,top-10,w+16,12);
  if(o.rich){ctx.fillStyle='#2f7a64';ctx.fillRect(L-8,top-16,w+16,6);ctx.fillStyle='#b8342b';for(let x=L;x<L+w;x+=26)ctx.fillRect(x,top-16,8,6);}
  giwaRoof(cx,top-4,w+80,rh,o.roof||'#3a3e46');}

function thatchRoof(cx,y,w,h,col='#c9a75c',seed=3){
  const shape=()=>{ctx.beginPath();ctx.moveTo(cx-w/2,y);ctx.bezierCurveTo(cx-w/2-6,y-h*1.05,cx+w/2+6,y-h*1.05,cx+w/2,y);ctx.quadraticCurveTo(cx,y+16,cx-w/2,y);ctx.closePath();};
  shape();const g=ctx.createLinearGradient(0,y-h,0,y);g.addColorStop(0,shade(col,.15));g.addColorStop(1,shade(col,-.2));ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();const r=rng(seed);ctx.strokeStyle='rgba(110,78,30,.35)';ctx.lineWidth=1.3;ctx.beginPath();
  for(let i=0;i<260;i++){const x=cx-w/2+r()*w,yy=y-h+r()*(h+10);ctx.moveTo(x,yy);ctx.lineTo(x+(x-cx)*.02,yy+10+r()*8);}ctx.stroke();
  ctx.strokeStyle='rgba(95,62,24,.5)';ctx.lineWidth=2;ctx.beginPath();for(let x=cx-w;x<cx+w;x+=30){ctx.moveTo(x,y-h);ctx.lineTo(x+h,y+20);ctx.moveTo(x+h,y-h);ctx.lineTo(x,y+20);}ctx.stroke();ctx.restore();
  shape();st(INK,2.2);ctx.beginPath();for(let x=cx-w/2+4;x<cx+w/2-4;x+=6){const yy=y+16*(1-Math.pow((x-cx)/(w/2),2))*.5+2;ctx.moveTo(x,yy-3);ctx.lineTo(x+1,yy+5);}st('rgba(110,80,35,.7)',1.4);}

function chogaHouse(cx,gy,w,bh,rh,o={}){
  const L=cx-w/2;ctx.fillStyle='#8d8476';ctx.fillRect(L-8,gy-14,w+16,14);
  const top=gy-14-bh;ctx.fillStyle='#b48b58';ctx.fillRect(L,top,w,bh);
  const r=rng(o.seed||5);for(let i=0;i<40;i++){E(L+r()*w,top+r()*bh,4+r()*10,2+r()*5);fs(r()<.5?'rgba(90,60,30,.12)':'rgba(255,240,210,.1)');}
  const n=3,bw=w/n;latticeDoor(L+bw+bw*.25,top+16,bw*.5,bh-22,o.lit);latticeDoor(L+bw*.3,top+bh*.25,bw*.4,bh*.35,o.lit);latticeDoor(L+bw*2.3,top+bh*.25,bw*.4,bh*.35,o.lit);
  ctx.fillStyle='#6e4a2c';for(let i=0;i<=n;i++){ctx.fillRect(L+i*bw-5,top,10,bh);}
  ctx.fillStyle='#8a6440';ctx.fillRect(L-4,gy-34,w+8,12);ctx.strokeStyle=INK;ctx.lineWidth=1.2;ctx.strokeRect(L-4,gy-34,w+8,12);
  ctx.fillStyle='#5a3b22';ctx.fillRect(L-10,top-6,w+20,9);
  thatchRoof(cx,top+4,w+90,rh,o.roof||'#c9a75c',o.seed||3);
  if(o.gourds){ctx.strokeStyle='#4f7a32';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx-w*.45,top);ctx.bezierCurveTo(cx-w*.3,top-rh*.8,cx+w*.1,top-rh*.95,cx+w*.4,top-rh*.3);ctx.stroke();
    const lv=[[-.38,-.4],[-.25,-.7],[-.08,-.86],[.1,-.85],[.25,-.66],[.36,-.42],[-.15,-.55],[.18,-.5]];
    lv.forEach(([a,b],i)=>{E(cx+w*a,top+rh*b,13,8,i);fs(i%2?'#5f8c3a':'#4c7a2e');});
    [[-.2,-.66,26],[.05,-.82,30],[.3,-.5,24]].forEach(([a,b,s])=>{E(cx+w*a,top+rh*b,s,s*.85);fs('#f3efe1');st(INK,1.6);E(cx+w*a-s*.3,top+rh*b-s*.25,s*.25,s*.18);fs('rgba(255,255,255,.7)');});}}

function stoneWall(x0,x1,top,bot,seed){ctx.fillStyle='#857e70';ctx.fillRect(x0,top,x1-x0,bot-top);const r=rng(seed);let row=0;
  for(let y=top+8;y<bot;y+=15,row++){for(let x=x0+(row%2)*11;x<x1;){const w=18+r()*12;const g=150+(r()*50|0);E(x+w/2,y,w/2-1,7.2);fs(`rgb(${g},${g-6},${g-18})`);st('rgba(40,30,20,.45)',1);x+=w;}}
  ctx.beginPath();ctx.moveTo(x0-6,top+4);ctx.lineTo(x0+4,top-12);ctx.lineTo(x1-4,top-12);ctx.lineTo(x1+6,top+4);ctx.closePath();fs('#43464d');st(INK,1.6);
  ctx.beginPath();for(let x=x0;x<x1;x+=10){ctx.moveTo(x,top-10);ctx.lineTo(x,top+3);}st('rgba(0,0,0,.3)',1.2);}

function gate(cx,gy,o){const ow=130,oh=150,L=cx-ow/2,R=cx+ow/2,top=gy-oh;const dw=ow/2*(1-.84*o);
  [[L,dw],[R-dw,dw]].forEach(([x,w])=>{ctx.fillStyle='#7a5233';ctx.fillRect(x,top+6,w,oh-8);ctx.strokeStyle='rgba(40,25,15,.6)';ctx.lineWidth=1.2;ctx.beginPath();for(let i=x+9;i<x+w;i+=9){ctx.moveTo(i,top+6);ctx.lineTo(i,gy-2);}ctx.stroke();ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.strokeRect(x,top+6,w,oh-8);
    if(w>20){ctx.fillStyle='#2b2420';for(let j=0;j<3;j++){C(x+w/2,top+30+j*45,2.6);ctx.fill();}}});
  ctx.fillStyle='#6b3f24';ctx.fillRect(L-13,top-6,13,oh+6);ctx.fillRect(R,top-6,13,oh+6);ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.strokeRect(L-13,top-6,13,oh+6);ctx.strokeRect(R,top-6,13,oh+6);
  ctx.fillStyle='#5a331d';ctx.fillRect(L-18,top-16,ow+36,13);
  giwaRoof(cx,top-14,ow+70,56,'#3a3e46');}

function tree(x,gy,h,seed,cols,o={}){const r=rng(seed);ctx.save();
  ctx.beginPath();ctx.moveTo(x-h*.05,gy);ctx.quadraticCurveTo(x-h*.01,gy-h*.4,x-h*.05,gy-h*.62);ctx.lineTo(x+h*.03,gy-h*.62);ctx.quadraticCurveTo(x+h*.05,gy-h*.35,x+h*.06,gy);ctx.closePath();fs('#4b3627');st(INK,1.8);
  ctx.strokeStyle='#4b3627';ctx.lineCap='round';for(let i=0;i<7;i++){const a=-PI/2+(r()-.5)*2.4,L=h*(.25+r()*.25);ctx.lineWidth=h*.022;ctx.beginPath();ctx.moveTo(x,gy-h*.56);ctx.quadraticCurveTo(x+Math.cos(a)*L*.5,gy-h*.56+Math.sin(a)*L*.35,x+Math.cos(a)*L,gy-h*.56+Math.sin(a)*L);ctx.stroke();}
  const n=o.sparse?16:28;for(let i=0;i<n;i++){const a=r()*TAU,d=Math.sqrt(r())*h*.36;C(x+Math.cos(a)*d*1.3,gy-h*.72+Math.sin(a)*d*.8,h*(.07+r()*.06));ctx.globalAlpha=o.alpha||.85;fs(cols[(r()*cols.length)|0]);ctx.globalAlpha=1;}
  if(o.fruit)for(let i=0;i<12;i++){const a=r()*TAU,d=Math.sqrt(r())*h*.34;C(x+Math.cos(a)*d*1.25,gy-h*.72+Math.sin(a)*d*.8,h*.024);fs(o.fruit);st('rgba(60,30,10,.7)',1);}
  if(o.blossom)for(let i=0;i<70;i++){const a=r()*TAU,d=Math.sqrt(r())*h*.38;const fx=x+Math.cos(a)*d*1.3,fy=gy-h*.72+Math.sin(a)*d*.8;for(let k=0;k<5;k++){C(fx+Math.cos(k*TAU/5)*2.6,fy+Math.sin(k*TAU/5)*2.6,2.3);fs(i%3?'#fbe3ea':'#ffffff');}C(fx,fy,1.2);fs('#e0a03c');}
  ctx.restore();}

function fence(x0,x1,gy,h){ctx.save();ctx.strokeStyle='#7a5a36';ctx.lineWidth=2;ctx.beginPath();for(let x=x0;x<x1;x+=5){ctx.moveTo(x,gy);ctx.lineTo(x+Math.sin(x)*2,gy-h-Math.sin(x*1.7)*5);}ctx.stroke();
  ctx.strokeStyle='#5a3f24';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x0,gy-h*.35);ctx.lineTo(x1,gy-h*.35);ctx.moveTo(x0,gy-h*.75);ctx.lineTo(x1,gy-h*.75);ctx.stroke();ctx.restore();}

function ricePile(cx,gy){const rows=[4,3,2,1],w=48,h=26;rows.forEach((n,ri)=>{for(let i=0;i<n;i++){const x=cx-(n*w)/2+i*w+w/2,y=gy-h/2-ri*(h-5);

  giwaHouse(920,470,520,130,110,{bays:4,open:1,rich:true,lit:true});ricePile(1180,470);onggi(640,470,.8);onggi(690,472,.6);
  const fj=t>8.4;
  [[HWIFE,925,452,.8,'smile',0],[KID1,880,456,.52,'joy',1],[KID2,975,458,.5,'joy',2],[KID3,1020,460,.44,'joy',3]].forEach(([K,x,y,s,e,i])=>{const p=mk(K,{x,y:y-(fj&&i?Math.abs(Math.sin(t*7+i))*14:0),s,face:-1,t,expr:t<7?'sad':e,shadow:false});
    if(i===0){p.armF=ikLocal(true,24,-40);p.armB=ikLocal(false,20,-36);}else if(fj){p.armF=[2,.75];p.armB=[2.3,.5];}drawPerson(p);});
  const nk=kf(t,[[0,1],[6.4,1],[7.8,0]]);
  const bow=t<5.5?.3+.55*Math.pow(Math.max(0,Math.sin((t-.4)*2.4)),1.5):kf(t,[[5.5,.3],[6.4,.25],[7.8,.02],[8.4,.02],[9,.1]]);
  const embrace=seg(t,8.2,9);const sway=t>9?Math.sin(t*1.6)*.03:0;
  const nb=mk(NOLBU_TORN,{x:kf(t,[[0,470],[8,470],[9,484]]),y:652,s:1.2,kneel:nk,lean:bow+sway,t,expr:t<8.6?'cry':'smile',tears:t>=8.6,headTilt:t<5.5?.2:kf(t,[[5.5,.1],[9,-.1]])});
  const hx=kf(t,[[0,800],[4.3,800],[5.5,585],[8.2,585],[9,560]]);const walking=t>4.3&&t<5.5;
  const hb=mk(HEUNGBU_RICH,{x:hx,y:652,s:1.2,face:-1,t,walk:walking?(800-hx)/9:null,lean:kf(t,[[0,.05],[5.4,.08],[5.9,.6],[6.4,.6],[7.8,.06],[8.4,.04],[9,.1]])-sway,
    expr:t<4.3?'sad':t<7.8?'neutral':'smile',headTilt:kf(t,[[0,0],[8.2,0],[9,.22]])});
  if(t<5.5){nb.armF=ikLocal(true,42,-52);nb.armB=ikLocal(false,40,-50);}
  const M={x:kf(t,[[5.6,515],[6.4,516],[7.8,522]]),y:kf(t,[[5.6,550],[6.4,550],[7.8,505]])};
  if(t>=5.5&&t<8.4){nb.armF=ikW(nb,true,M.x+2,M.y);nb.armB=ikW(nb,false,M.x-2,M.y+4);}
  if(t<4.3){const r=seg(t,1.5,2.4);hb.armF=[lerp(.12,1.25,r),lerp(.25,.2,r)];hb.armB=[lerp(-.06,1.1,r),.25];}
  else if(t<5.6){const s=walker(t,800,4.3,180,585);Object.assign(hb,swingArms({moving:true,phase:(800-hx)/9}));}
  else if(t<8.4){hb.armF=ikW(hb,true,M.x+4,M.y-2);hb.armB=ikW(hb,false,M.x+6,M.y+3);}
  if(t>=8.4){const nTarget=torsoToWorld(nb,-14,-52),hTarget=torsoToWorld(hb,-14,-52);
    const a=embrace;const nh=handW(Object.assign({},nb,{armF:ikW(nb,true,M.x,M.y)}),true);
    hb.armF=ikW(hb,true,lerp(M.x,nTarget.x,a),lerp(M.y,nTarget.y,a),true);hb.armB=ikW(hb,false,lerp(M.x,nTarget.x+6,a),lerp(M.y,nTarget.y+12,a),true);
    nb.armF=ikW(nb,true,lerp(M.x,hTarget.x,a),lerp(M.y,hTarget.y,a),true);nb.armB=ikW(nb,false,lerp(M.x,hTarget.x-6,a),lerp(M.y,hTarget.y+12,a),true);nb.noFront=true;}
  drawPerson(nb);drawPerson(hb);if(nb.noFront)drawFrontArm(nb);
  if(t>8.6){ctx.save();ctx.globalAlpha=seg(t,8.6,9.6);motes(t,36,12,520,430,520,320,'#fff2b8');ctx.restore();}
  ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle='rgba(255,170,90,.25)';ctx.fillRect(-900,-900,W+1800,H+1800);ctx.restore();}

function sEnd(t){sky('#efe3c6','#e3cfa5');ridge(3,560,120,'#5f6b6a',.5);ridge(8,620,80,'#3d4746',.65);
  for(let i=0;i<2;i++){const x=1400-t*360-i*70,y=120+i*36+Math.sin(t*2+i)*10;drawSwallow(x,y,1.2-i*.2,-1,Math.sin(t*14+i*2)*.9,{fly:true});}
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=seg(t,.3,1.3);ctx.font=`210px ${F_BRUSH}`;ctx.fillStyle='#231812';ctx.fillText('끝',W/2,300);
  ctx.globalAlpha=seg(t,1,2);ctx.font=`28px ${F_SERIF}`;ctx.fillStyle='#4a3626';ctx.fillText('형제는 서로 아끼며 사이좋게 지냈답니다',W/2,440);
  ctx.font=`19px ${F_SERIF}`;ctx.fillStyle='#7a6450';ctx.fillText('〈흥부전〉 · 조선 후기 판소리계 소설',W/2,486);ctx.restore();}

/* =========================================================
   타임라인
   ========================================================= */
const SCENES=[
  {key:'제목',dur:3.5,win:[0,4.5],draw:sTitle},
  {key:'1장',label:'욕심쟁이 형, 놀부',dur:6,win:[.3,9.8],draw:s1,subs:[[.15,4.85,'부모님이 돌아가시자 큰아들 놀부는 논밭과 곳간을 모두 차지했어요. 아우 흥부네 식구는 빈손으로 쫓겨났지요.']]},
  {key:'2장',label:'주걱으로 뺨을 맞은 흥부',dur:6.5,win:[1.2,9.8],draw:s2,subs:[[.15,4.85,'배고픈 흥부가 형님 댁에 밥을 얻으러 갔어요. 형수는 밥주걱으로 흥부의 뺨을 철썩! 흥부는 뺨에 붙은 밥알을 떼어 먹었어요.']]},
  {key:'3장',label:'제비 다리를 고친 흥부',dur:6,win:[.6,9.6],draw:s3,subs:[[.15,4.85,'봄날, 흥부네 처마 밑 제비 새끼가 떨어져 다리가 부러졌어요. 흥부는 부러진 다리를 정성껏 동여매 주었지요.']]},
  {key:'4장',label:'슬근슬근 박 타기',dur:6.5,win:[2.4,10.8],draw:s4,subs:[[.15,4.85,'강남에서 돌아온 제비가 박씨를 물어 왔어요. “슬근슬근 톱질이야!” 박을 타자 금은보화가 쏟아져 나왔어요.']]},
  {key:'5장',label:'놀부도 박을 탔지만',dur:3,win:[1.6,5],draw:s5a,subs:[[.15,4.85,'놀부의 박에서는 도깨비가 튀어나와 놀부는 쫄딱 망했어요.']]},
  {key:'5장b',label:null,dur:4,win:[2.6,12.4],draw:s5b,subs:[[.15,4.85,'놀부가 잘못을 뉘우치자 흥부는 형을 일으켜 세웠고, 형제는 사이좋게 지냈답니다.']]},
  {key:'끝',dur:3.5,win:[0,5],draw:sEnd}];
let acc=0;SCENES.forEach(s=>{s.start=acc;acc+=s.dur;});const TOTAL=acc;
/* 모둠 활동용: ?ch=1~5 이면 그 장만 재생 (5장은 화해 장면까지) */
const CH=(new URLSearchParams(location.search).get('ch')||'').replace(/[^1-5]/g,'');
let R0=0,R1=TOTAL;
if(CH){const a=SCENES.find(x=>x.key===CH+'장');const b=SCENES.filter(x=>x.key.indexOf(CH+'장')===0).pop();R0=a.start;R1=b.start+b.dur;document.documentElement.classList.add('one-ch');}
const RL=R1-R0;
function tellParent(type){try{parent.postMessage({film:type,ch:CH},'*')}catch(e){}}
let subsOn=true;

function wrapText(txt,maxW){const words=txt.split(' ');const lines=[];let cur='';words.forEach(w=>{const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tst;});if(cur)lines.push(cur);return lines;}
function drawSub(txt,al){ctx.save();ctx.globalAlpha=al;ctx.font=`28px ${F_SERIF}`;const lines=wrapText(txt,1140);const lh=41,bh=lines.length*lh+24,y0=H-40-bh;
  const mw=Math.max(...lines.map(l=>ctx.measureText(l).width));RR(W/2-mw/2-30,y0,mw+60,bh,14);fs('rgba(18,12,8,.66)');
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fbf3e1';lines.forEach((l,i)=>ctx.fillText(l,W/2,y0+12+lh*(i+.5)+1));ctx.restore();}
function drawLabel(s,t){if(!s.label)return;const a=seg(t,.2,.6)*(1-seg(t,3.6,4.3));if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.textBaseline='middle';
  RR(36,34,ctx.measureText?0:0,0,0);ctx.font=`26px ${F_SERIF}`;const lw=ctx.measureText(s.label).width;RR(32,30,lw+124,56,10);fs('rgba(18,12,8,.55)');
  ctx.font=`44px ${F_BRUSH}`;ctx.fillStyle='#e8c37a';ctx.fillText(s.key.replace('b',''),50,60);ctx.font=`26px ${F_SERIF}`;ctx.fillStyle='#fbf3e1';ctx.fillText(s.label,140,59);ctx.restore();}

function render(T){T=clamp(T,0,TOTAL-1e-4);let i=0;while(i<SCENES.length-1&&T>=SCENES[i].start+SCENES[i].dur)i++;const s=SCENES[i],t=T-s.start;
  ctx.setTransform(VS,0,0,VS,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.save();s.draw(s.win?lerp(s.win[0],s.win[1],t/s.dur):t);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.09;const f=Math.floor(T*12);ctx.drawImage(paper,-((f*37)%64),-((f*23)%64));ctx.restore();
  ctx.drawImage(vign,0,0);
  if(subsOn&&s.subs)s.subs.forEach(([a,b,txt])=>{if(b===4.85)b=s.dur-.15;if(t>=a&&t<=b){const al=Math.min(lin(t,a,a+.3),1-lin(t,b-.3,b));drawSub(txt,al);}});
  drawLabel(s,t);
  const fin=s.key==='5장b'?.25:.4;const fade=Math.max(1-lin(t,0,fin),i===SCENES.length-1?lin(t,s.dur-.8,s.dur):lin(t,s.dur-.3,s.dur));
  if(fade>0){ctx.fillStyle=`rgba(8,5,3,${fade})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();return i;}

/* =========================================================
   재생 컨트롤
   ========================================================= */
const ui=document.getElementById('ui'),pp=document.getElementById('pp'),fill=document.getElementById('fill'),bar=document.getElementById('bar'),tm=document.getElementById('tm'),chaps=document.getElementById('chaps'),big=document.getElementById('big'),cc=document.getElementById('cc');
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',ICON_REPLAY='<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>';
let T=0,playing=false,last=null,hideTimer=null,curIdx=-1;
const chapBtns=[];SCENES.forEach((s,i)=>{if(i>0){const tk=document.createElement('div');tk.className='tick';tk.style.left=(s.start/TOTAL*100)+'%';bar.appendChild(tk);}
  if(/^\d장$/.test(s.key)){const b=document.createElement('button');b.className='chap';b.textContent=s.key;b.onclick=()=>{T=s.start;poke();if(!playing)setPlaying(true);};chaps.appendChild(b);chapBtns.push([b,i]);}});
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function setPlaying(v){if(v&&T>=R1-.05)T=R0;playing=v;last=null;pp.innerHTML=v?ICON_PAUSE:ICON_PLAY;big.innerHTML=T>=R1-.05?ICON_REPLAY:ICON_PLAY;big.classList.toggle('show',!v);poke();}
function poke(){ui.classList.remove('hide');document.body.style.cursor='';clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(playing){ui.classList.add('hide');document.body.style.cursor='none';}},2600);}
function frame(now){if(playing){if(last!=null)T+=Math.min(.1,(now-last)/1000);last=now;if(T>=R1){T=R1;setPlaying(false);tellParent('end');}}
  const i=render(Math.min(T,R1-1e-3));fill.style.width=((T-R0)/RL*100)+'%';tm.textContent=`${fmt(T-R0)} / ${fmt(RL)}`;
  if(i!==curIdx){curIdx=i;const key=SCENES[i].key.replace('b','');chapBtns.forEach(([b,j])=>b.classList.toggle('on',SCENES[j].key===key));}
  requestAnimationFrame(frame);}
pp.onclick=()=>setPlaying(!playing);big.onclick=()=>setPlaying(true);cvs.onclick=()=>setPlaying(!playing);
cc.onclick=()=>{subsOn=!subsOn;cc.textContent=subsOn?'자막 켜짐':'자막 꺼짐';};
document.getElementById('fsb').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
let drag=false;const seekX=e=>{const r=bar.getBoundingClientRect();T=R0+clamp((e.clientX-r.left)/r.width)*RL;last=null;};
bar.addEventListener('pointerdown',e=>{drag=true;bar.setPointerCapture(e.pointerId);seekX(e);});bar.addEventListener('pointermove',e=>{if(drag)seekX(e);});bar.addEventListener('pointerup',()=>{drag=false;});
addEventListener('mousemove',poke);addEventListener('touchstart',poke,{passive:true});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='k'){e.preventDefault();setPlaying(!playing);}else if(e.key==='ArrowRight'){T=Math.min(R1,T+5);last=null;poke();}else if(e.key==='ArrowLeft'){T=Math.max(R0,T-5);last=null;poke();}else if(e.key==='f'||e.key==='F')document.getElementById('fsb').click();else if(e.key==='c'||e.key==='C')cc.click();});
addEventListener('resize',()=>{resize();});
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);const sc=Math.min(innerWidth/W,innerHeight/H);const cw=Math.max(1,Math.floor(W*sc)),ch=Math.max(1,Math.floor(H*sc));cvs.style.width=cw+'px';cvs.style.height=ch+'px';cvs.width=Math.round(cw*dpr);cvs.height=Math.round(ch*dpr);VS=cvs.width/W;}
resize();pp.innerHTML=ICON_PLAY;T=R0;
addEventListener('message',e=>{if(e.data&&e.data.film==='replay'){T=R0;setPlaying(true);}});
window.__seek=x=>{T=x;playing=false;render(T);};
const fontsReady=document.fonts?Promise.race([Promise.all([document.fonts.load(`40px "Nanum Brush Script"`),document.fonts.load(`30px "Gowun Batang"`)]),new Promise(r=>setTimeout(r,1800))]):Promise.resolve();
fontsReady.catch(()=>{}).then(()=>{if(!window.__noAutoplay)setPlaying(true);requestAnimationFrame(frame);});
</script>
