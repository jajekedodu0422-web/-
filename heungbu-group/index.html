<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>흥부전 조각 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 권의 흥부전 그림책: 한지 종이, 오방색 띠, 붉은 낙관 */
:root{
  --desk:#e6d6b8;--paper:#fbf5e8;--paper-2:#f3e9d3;--ink:#3f332c;--ink-soft:#7a6a5c;--line:#d8c6a3;
  --red:#c8443a;--blue:#2f6f9f;--yellow:#e2b33c;--green:#5d8f4e;--wood:#b98a5e;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --story:"Gowun Batang","Nanum Myeongjo",serif;
  --ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:19px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(90deg,rgba(120,80,40,.05) 0 2px,transparent 2px 90px),radial-gradient(ellipse at 50% 30%,#efe2c8,var(--desk) 70%);background-attachment:fixed}
h1,h2,p{margin:0}
.wrap{max-width:900px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 120px max(16px,env(safe-area-inset-right,0px))}
body.teacher .wrap{max-width:1400px;padding-bottom:40px}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}.center{text-align:center;justify-content:center}
.lab{font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--red)}
.lab.light{color:#f3d58c}
.h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.2}
.soft{color:var(--ink-soft);font-size:16px;margin-top:6px}
.red{color:var(--red)}
.obang{height:8px;border-radius:2px;background:linear-gradient(90deg,#c8443a 0 20%,#e2b33c 20% 40%,#5d8f4e 40% 60%,#2f6f9f 60% 80%,#2b2b2b 80%)}
.card,.story,.note-book{background:var(--paper);border-radius:14px;padding:20px;box-shadow:0 10px 26px rgba(60,35,15,.18),inset 0 0 0 2px #e7d8b9}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin-bottom:8px}
.story{border-top:8px solid;border-image:linear-gradient(90deg,#c8443a 0 20%,#e2b33c 20% 40%,#5d8f4e 40% 60%,#2f6f9f 60% 80%,#2b2b2b 80%) 1;border-radius:0 0 14px 14px}
.story p{font-family:var(--story);font-size:clamp(18px,2.4vw,22px);line-height:1.85;margin-top:6px;word-break:keep-all}
.story em{font-style:normal;color:var(--red);font-weight:700}
.task{font-family:var(--display);font-size:clamp(21px,3vw,28px);line-height:1.4;margin:8px 0 10px;word-break:keep-all}
.btn{font:inherit;font-family:var(--display);font-size:19px;padding:10px 22px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.big{font-size:23px;padding:14px 30px}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:3px}
/* 표지 */
.cover{background:#6e4128;color:#fbeed4;border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 18px 40px rgba(60,35,15,.35),inset 0 0 0 4px #5a3420,inset 0 0 0 8px #c9a77c}
.cover h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1.25;margin:10px 0}
.cover p{font-family:var(--story);font-size:18px;max-width:32em;margin:14px auto 0;color:#f0dfbf;word-break:keep-all}
.leader{display:inline-flex;align-items:center;gap:10px;background:#fbf5e8;color:var(--ink);border-radius:999px;padding:6px 18px;font-size:18px}
.leader b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--red)}
.tab{width:20px;height:26px;flex:none}
.chapbadge{display:inline-block;margin-top:14px;border:2px solid #e2b33c;border-radius:8px;padding:6px 16px;font-family:var(--display);font-size:22px;color:#f3d58c}
.rules{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{padding-left:26px;position:relative;word-break:keep-all}
.rules li::before{content:"";position:absolute;left:4px;top:.55em;width:11px;height:11px;border-radius:50%;background:var(--red)}
.rules b{font-family:var(--display);font-weight:400}
/* 상단 막대 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;background:var(--paper);border-radius:14px;padding:10px 16px;box-shadow:0 6px 18px rgba(60,35,15,.15)}
.who{font-family:var(--display);font-size:20px;color:var(--red)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.steps span{font-size:14px;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft)}
.steps span.on{border-color:var(--red);color:var(--red);font-weight:700}
.steps span.ok{background:var(--green);border-color:var(--green);color:#fff}
.meter{display:flex;gap:16px}
.meter div{display:grid;justify-items:end;line-height:1.2}
.meter small{font-size:13px;color:var(--ink-soft)}
.meter b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
/* 그림 찾기 */
.tapguide{margin:0 0 10px;padding:10px 14px;background:var(--red);color:#fffdf6;border-radius:10px;font-family:var(--display);font-size:20px;display:flex;gap:10px;align-items:center}
.tapguide .ar{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.frame{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;border:10px solid #c9a77c;border-radius:6px;box-shadow:inset 0 0 0 2px #8f6a45,0 0 0 2px #8f6a45;background:#f4ead5}
.frame svg{display:block;width:100%;height:100%;cursor:pointer}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:10px}
.hot.found{outline:4px solid var(--green);background:rgba(93,143,78,.18)}
.hot.found::after{content:"✓";position:absolute;right:-10px;top:-12px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:16px}
.hot.nope{outline:3px dashed var(--red);outline-offset:-3px}
.miss{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--red);pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.endf{max-width:min(340px,60vh);border-color:#e2b33c}
/* 공책 */
.note-book{background:#fffdf4;background-image:repeating-linear-gradient(transparent 0 45px,rgba(47,111,159,.18) 45px 46px);border-left:10px solid var(--red)}
.nb-body{font-family:var(--story);font-size:clamp(20px,2.6vw,25px);line-height:46px;margin-top:4px;word-break:keep-all}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--red);text-align:center;color:var(--red);padding:0 6px;line-height:34px;font-weight:700}
.blank.cur{background:rgba(226,179,60,.45);border-radius:6px 6px 0 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(226,179,60,.15)}}
.blank.filled{border-bottom-color:transparent;background:rgba(200,68,58,.08);border-radius:6px}
.sent{font:inherit;color:inherit;background:none;border:0;padding:0 3px;cursor:pointer;text-align:left;display:inline;line-height:inherit;border-radius:4px}
.sent:hover,.sent:focus-visible{background:rgba(226,179,60,.35);outline:none}
.sent.no{text-decoration:line-through;text-decoration-color:var(--red);cursor:default;background:none;opacity:.6}
.sent.fixed{color:#2f5a2a;background:rgba(93,143,78,.16)}
.forged{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(200,68,58,.6)}
.words{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.word{font:inherit;font-family:var(--display);font-size:22px;padding:10px 18px;cursor:pointer;background:var(--red);color:#fffdf6;border:0;border-radius:10px;box-shadow:0 3px 0 #8f2e26;transform:rotate(-1.5deg)}
.word:nth-child(even){transform:rotate(1.5deg);background:var(--blue);box-shadow:0 3px 0 #1f4b6c}
.word:nth-child(3n){background:var(--green);box-shadow:0 3px 0 #3e6334}
.word:disabled{opacity:.2;cursor:default}
.fixopts{display:grid;gap:10px;margin-top:10px}
.fixopt{font:inherit;font-family:var(--story);font-size:20px;text-align:left;padding:12px 16px;cursor:pointer;background:var(--paper-2);color:var(--ink);border:2px solid var(--line);border-radius:10px;word-break:keep-all}
.fixopt.right{background:var(--green);border-color:var(--green);color:#fff}
.fixopt.wrong{opacity:.35;text-decoration:line-through;text-decoration-color:var(--red)}
.fb{min-height:1.6em;margin-top:12px;font-weight:700;font-size:19px}
.fb.bad{color:var(--red)}.fb.good{color:#3e6a2c}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.glow{outline:4px solid var(--yellow)!important;outline-offset:2px;animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{outline-color:transparent}}
.blot{position:fixed;inset:0;pointer-events:none;z-index:30;display:grid;place-items:center}
.blot i{width:180px;height:160px;background:#2b221e;border-radius:48% 52% 45% 55%/55% 45% 58% 42%;opacity:0;animation:blot .7s ease-out}
@keyframes blot{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}
#hintbtn{position:fixed;z-index:16;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--yellow);color:var(--ink);border-color:var(--ink);font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#hintnote{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:860px;margin:0 auto;background:#fffdf4;border:3px solid var(--yellow);border-radius:12px;padding:12px 16px;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* 글자 얻기 */
.reveal{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 40%,#7a4a2c,#3a2214 70%);display:grid;place-items:center;overflow:auto;padding:16px}
.rv-inner{display:grid;justify-items:center;gap:14px;text-align:center;max-width:620px}
.rv-lbl{color:#f3d58c;font-size:17px;letter-spacing:.1em;animation:up .6s ease-out both}
.rv-got{width:180px;height:180px;border:7px solid var(--red);border-radius:16px;background:#fbf5e8;color:var(--red);font-family:var(--display);font-size:130px;line-height:1;display:grid;place-items:center;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) .4s both;box-shadow:0 0 40px rgba(226,179,60,.6)}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.rv-name{font-family:var(--display);font-size:40px;color:#fbeed4;animation:up .6s ease-out .9s both}
.rv-sub{color:#f0dfbf;font-size:18px;word-break:keep-all;animation:up .6s ease-out 1.1s both}
.reveal .btn{animation:up .5s ease-out 1.3s both;background:#fbf5e8;color:var(--ink)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bigl{font-family:var(--display);font-size:clamp(100px,22vw,150px);line-height:1;color:var(--red)}
.stamp{display:inline-grid;place-items:center;width:92px;height:92px;border:4px solid var(--red);color:var(--red);font-family:var(--display);font-size:26px;transform:rotate(-8deg);line-height:1.1;text-align:center;border-radius:10px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-variant-numeric:tabular-nums}
.meta dt{color:var(--ink-soft)}.meta dd{margin:0;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(40,25,15,.6);display:grid;place-items:center;z-index:50;padding:16px}
.overlay .card{max-width:460px;width:100%}
/* 선생님 화면 */
.gcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.gcard{background:var(--paper);border-radius:14px;padding:12px;display:grid;gap:8px;box-shadow:0 10px 24px rgba(60,35,15,.2);border-top:8px solid}
.gcard:nth-child(1){border-color:#e8604f}.gcard:nth-child(2){border-color:#e39b2a}.gcard:nth-child(3){border-color:#4f9a6b}.gcard:nth-child(4){border-color:#3f7fd6}.gcard:nth-child(5){border-color:#8f5cc9}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.gn{font-family:var(--display);font-size:30px}
.gl{font-size:14px;color:var(--ink-soft)}.gl b{color:var(--red);font-size:20px}
.qrbox{background:#fff;padding:8px;border-radius:8px;display:grid;place-items:center}
.qrbox canvas{width:100%!important;height:auto!important;max-width:230px}
.ld{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 10px}
.ld .ldt{font-size:13px;background:var(--red);padding:2px 8px;border-radius:4px}
.ld b{font-family:var(--display);font-weight:400;font-size:26px;color:#ffd98a;flex:1}
.gm{font:inherit;font-size:14px;width:100%;resize:vertical;background:#fffdf4;border:1px solid var(--line);border-radius:6px;padding:6px;color:var(--ink)}
.slots5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;max-width:1000px;margin:0 auto;width:100%}
.slot5{border:4px dashed var(--wood);border-radius:16px;display:grid;justify-items:center;padding:16px 6px;gap:8px;background:rgba(251,245,232,.5)}
.slot5 .sg{font-size:15px;color:var(--ink-soft);text-align:center}
.slot5 .sl{font-family:var(--display);font-size:clamp(64px,10vw,130px);color:#cbb894;line-height:1}
.slot5.on{border-style:solid;border-color:var(--red);background:var(--paper)}
.slot5.on .sl{color:var(--red);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}
.final{font-family:var(--display);font-size:clamp(60px,11vw,120px);color:var(--red);letter-spacing:.08em;line-height:1.1;margin-top:6px}
.final.light{font-size:clamp(44px,7vw,84px);white-space:nowrap;color:#ffd98a;text-shadow:0 0 24px rgba(226,179,60,.6)}
.lead{font-family:var(--story);font-size:22px;margin-top:8px}
@media (max-width:1000px){.gcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.gcards{grid-template-columns:1fr 1fr}.slots5{gap:6px}.meter b{font-size:22px}body{font-size:17px}}
@media (prefers-reduced-motion:reduce){.shake,.fade,.tapguide .ar,.blank.cur,.miss,.rv-got,.rv-lbl,.rv-name,.rv-sub,.reveal .btn,.slot5.on .sl{animation:none}}

.nb-body>span,.nb-body>button.sent{display:block;padding:0 3px}
/* ---------- v2: 이야기 영상 ---------- */
.movie{background:#3a2214;border-radius:18px;padding:16px;box-shadow:0 18px 40px rgba(60,35,15,.35),inset 0 0 0 4px #5a3420;display:grid;gap:12px;justify-items:center}
.mv-top{display:flex;gap:12px;align-items:baseline;justify-content:center;flex-wrap:wrap}
.mv-ttl{font-family:var(--display);font-size:clamp(26px,4vw,36px);color:#fbeed4}
.frame.mv{max-width:520px;border-color:#e2b33c}
.subs{min-height:150px;width:100%;max-width:640px;display:grid;gap:8px;align-content:start}
.sub-line{font-family:var(--story);font-size:clamp(19px,2.6vw,24px);color:#fbeed4;text-align:center;line-height:1.5;word-break:keep-all;animation:up .6s ease-out both}
.sub-line:last-child{color:#ffd98a;font-weight:700}
#next.ready{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06)}}
/* ---------- v2: 문제 ---------- */
.qdots{display:flex;gap:6px;align-items:center}
.qdots span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;border:2px solid var(--line);color:var(--ink-soft);background:var(--paper)}
.qdots span.on{border-color:var(--red);color:var(--red)}
.qdots span.ok{background:var(--green);border-color:var(--green);color:#fff}
.qdots .lock{border-radius:8px;border-style:dashed;border-color:var(--red);color:var(--red)}
.qcard{display:grid;gap:12px}
.qcard .task{margin:4px 0 0}
.src{margin:0;background:#f3e6c8;border-left:6px solid var(--wood);border-radius:8px;padding:14px 16px}
.src p{font-family:var(--story);font-size:clamp(17px,2.2vw,20px);line-height:1.75;word-break:keep-all}
.src cite{display:block;text-align:right;font-style:normal;color:var(--ink-soft);font-size:15px;margin-top:6px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:clamp(17px,2.3vw,21px);text-align:left;line-height:1.4;word-break:keep-all;display:flex;gap:10px;align-items:baseline;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);color:var(--ink);cursor:pointer}
.opt b{font-family:var(--display);font-weight:400;color:var(--red);flex:none}
.opts.two .opt{justify-content:center;font-family:var(--display);font-size:28px}
.opt.sel{border-color:var(--blue);background:#e3eef7}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}.opt.right b{color:#fff}
.opt.wrong{opacity:.4;text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default}
.oxs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox{font-family:var(--display);font-size:72px;line-height:1;padding:18px 0;border-radius:16px;border:3px solid var(--line);background:var(--paper-2);cursor:pointer}
.ox.o{color:var(--blue)}.ox.x{color:var(--red)}
.ox.wrong{opacity:.35}
.ox:disabled{cursor:default}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px;align-items:center;background:var(--paper-2);border-radius:12px;padding:10px}
.ml{font-family:var(--display);font-size:22px;color:var(--ink)}
.mr{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:clamp(16px,2.1vw,19px);padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:#fffdf6;color:var(--ink);cursor:pointer;word-break:keep-all;text-align:left}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:disabled{cursor:default}
.pic{margin:0;display:grid;justify-items:center;gap:4px}
.pic-in{position:relative;display:inline-block;max-width:100%;border:6px solid #c9a77c;border-radius:4px;box-shadow:0 0 0 2px #8f6a45}
.pic-in img{display:block;max-width:100%;max-height:52vh;height:auto;user-select:none;-webkit-user-drag:none}
.pic figcaption{font-size:15px;color:var(--ink-soft)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.trio .pic-in img{max-height:26vh}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{background:var(--paper-2);border-radius:12px;padding:12px;display:grid;gap:8px}
.fg>b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--red)}
.bars{display:grid;gap:6px}
.br{display:flex;align-items:center;gap:8px;font-size:16px}
.br span:first-child{width:4.6em;flex:none}
.sq{display:flex}
.sq i{width:clamp(20px,3.4vw,30px);height:clamp(20px,3.4vw,30px);border:2px solid var(--ink);margin-left:-2px;background:#fffdf6}
.sq i.on{background:var(--yellow)}
.figcap{font-size:14px;color:var(--ink-soft);margin-top:-4px}

<script>
/* 작은 QR 인코더 (바이트 모드, 오류정정 M, 버전 1~10) */
var QRMini=(function(){
var ECC=[0,10,16,26,18,24,16,18,22,22,26],NB=[0,1,1,1,2,2,4,4,4,5,5];
function raw(v){var r=(16*v+128)*v+64;if(v>=2){var na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r}

function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255}
function div(d){var r=[];for(var i=0;i<d-1;i++)r.push(0);r.push(1);var root=1;for(var k=0;k<d;k++){for(var j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1]}root=mul(root,2)}return r}
function rem(data,dv){var r=dv.map(function(){return 0});data.forEach(function(b){var f=b^r.shift();r.push(0);dv.forEach(function(c,i){r[i]^=mul(c,f)})});return r}
function align(v){if(v===1)return[];var na=Math.floor(v/7)+2,step=Math.floor((v*8+na*3+5)/(na*4-4))*2,r=[6];for(var i=0;i<na-1;i++)r.splice(1,0,v*4+10-i*step);return r}
function encode(text){
  var data=Array.prototype.slice.call(new TextEncoder().encode(text)),ver,cap,cc;
  for(ver=1;ver<=10;ver++){cap=ndc(ver)*8;cc=ver<10?8:16;if(4+cc+data.length*8<=cap)break}
  if(ver>10)throw new Error("too long");
  var bits=[];function app(v,n){for(var i=n-1;i>=0;i--)bits.push((v>>>i)&1)}
  app(4,4);app(data.length,cc);data.forEach(function(b){app(b,8)});
  app(0,Math.min(4,cap-bits.length));app(0,(8-bits.length%8)%8);
  for(var pad=0xEC;bits.length<cap;pad^=0xEC^0x11)app(pad,8);
  var dcw=[];for(var i=0;i<bits.length;i+=8){var v=0;for(var j=0;j<8;j++)v=(v<<1)|bits[i+j];dcw.push(v)}
  var nb=NB[ver],el=ECC[ver],rw=Math.floor(raw(ver)/8),nshort=nb-rw%nb,sl=Math.floor(rw/nb),dv=div(el),blocks=[],k=0;
  for(i=0;i<nb;i++){var dl=sl-el+(i<nshort?0:1),d=dcw.slice(k,k+dl);k+=dl;var e=rem(d,dv);if(i<nshort)d.push(null);blocks.push(d.concat(e))}
  var fin=[];for(i=0;i<blocks[0].length;i++)for(j=0;j<blocks.length;j++)if(i!==sl-el||j>=nshort)fin.push(blocks[j][i]);
  var n=ver*4+17,m=[],fn=[];for(i=0;i<n;i++){m.push(new Array(n).fill(false));fn.push(new Array(n).fill(false))}
  function set(x,y,d){m[y][x]=d;fn[y][x]=true}
  for(i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var dd=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n)set(x,y,dd!==2&&dd!==4)}}
  finder(3,3);finder(n-4,3);finder(3,n-4);
  var ap=align(ver),na=ap.length;
  for(i=0;i<na;i++)for(j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)set(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
  function fmtb(mask){var d=(0<<3)|mask,r=d;for(var q=0;q<10;q++)r=(r<<1)^((r>>>9)*0x537);var b=((d<<10)|r)^0x5412;function g(q){return((b>>>q)&1)===1}
    for(q=0;q<6;q++)set(8,q,g(q));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(q=9;q<15;q++)set(14-q,8,g(q));
    for(q=0;q<8;q++)set(n-1-q,8,g(q));for(q=8;q<15;q++)set(8,n-15+q,g(q));set(8,n-8,true)}
  fmtb(0);
  if(ver>=7){var r=ver;for(var q=0;q<12;q++)r=(r<<1)^((r>>>11)*0x1F25);var b=(ver<<12)|r;for(q=0;q<18;q++){var bit=((b>>>q)&1)===1,a=n-11+q%3,c=Math.floor(q/3);set(a,c,bit);set(c,a,bit)}}
  var idx=0;for(var right=n-1;right>=1;right-=2){if(right===6)right=5;for(var vert=0;vert<n;vert++)for(j=0;j<2;j++){var x=right-j,up=((right+1)&2)===0,y=up?n-1-vert:vert;if(!fn[y][x]&&idx<fin.length*8){m[y][x]=((fin[idx>>>3]>>>(7-(idx&7)))&1)===1;idx++}}}
  var MK=[function(x,y){return(x+y)%2===0},function(x,y){return y%2===0},function(x,y){return x%3===0},function(x,y){return(x+y)%3===0},function(x,y){return(Math.floor(x/3)+Math.floor(y/2))%2===0},function(x,y){return x*y%2+x*y%3===0},function(x,y){return(x*y%2+x*y%3)%2===0},function(x,y){return((x+y)%2+x*y%3)%2===0}];
  function mask(q){for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(!fn[y][x]&&MK[q](x,y))m[y][x]=!m[y][x]}
  function pen(){var p=0,rows=[m,m[0].map(function(_,c){return m.map(function(r){return r[c]})})];
    rows.forEach(function(G){G.forEach(function(row){var run=1;for(var q=1;q<n;q++){if(row[q]===row[q-1])run++;else{if(run>=5)p+=run-2;run=1}}if(run>=5)p+=run-2;
      var s=row.map(function(v){return v?"1":"0"}).join("");["10111010000","00001011101"].forEach(function(pt){var i2=s.indexOf(pt);while(i2>=0){p+=40;i2=s.indexOf(pt,i2+1)}})})});
    for(var y=0;y<n-1;y++)for(var x=0;x<n-1;x++){var c=m[y][x];if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1])p+=3}
    var dark=0;m.forEach(function(r){r.forEach(function(v){if(v)dark++})});p+=Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10;return p}
  var best=0,bp=null;for(var q2=0;q2<8;q2++){mask(q2);fmtb(q2);var pv=pen();if(bp===null||pv<bp){best=q2;bp=pv}mask(q2)}
  mask(best);fmtb(best);return m;
}
function canvas(text,px){var m=encode(text),n=m.length,qz=4,s=Math.max(2,Math.floor(px/(n+qz*2))),c=document.createElement("canvas");c.width=c.height=(n+qz*2)*s;var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.fillStyle="#000";for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(m[y][x])g.fillRect((x+qz)*s,(y+qz)*s,s,s);return c}
return {encode:encode,canvas:canvas};
})();

var S=(function(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stage)return s}catch(e){}return blank()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var app=document.getElementById("app"),modal=document.getElementById("modal");
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function each(sel,fn){Array.prototype.forEach.call(app.querySelectorAll(sel),fn)}
var TAB='<svg class="tab" viewBox="0 0 20 26" aria-hidden="true"><rect x="1" y="1" width="18" height="24" rx="3" fill="#3f332c"/><rect x="3.5" y="3.5" width="13" height="17" rx="1" fill="#9fc3f0"/></svg>';
var timers=[];function clearT(){timers.forEach(clearTimeout);timers=[]}

/* ---------- 모둠: 문제 ---------- */
function head(){
  var p=PAGES[S.page];
  return '<header class="bar"><div><div class="who">'+esc(S.name)+(T&&T.n?' · 조장 '+esc(T.n):'')+' · '+esc(p.chap)+'</div><div class="soft" style="margin:0">'+esc(p.topic)+'</div></div>'+
   '<div class="qdots">'+p.qs.map(function(_,i){return '<span class="'+(i<S.qi||(i===S.qi&&S.solved)?"ok":i===S.qi?"on":"")+'">'+(i+1)+'</span>'}).join("")+'<span class="lock">?</span></div></header>';
}
function imgBox(k,cap,id){return '<figure class="pic"><div class="pic-in" id="'+(id||"")+'"><img src="'+IMG[k]+'" alt="'+esc(cap||"")+'"></div>'+(cap?'<figcaption>'+esc(cap)+'</figcaption>':'')+'</figure>'}
function renderQuiz(){
  var p=PAGES[S.page],q=p.qs[S.qi],st=S.st;
  var h=head()+'<div class="fade col" id="sh"><div class="card qcard"><div class="lab">문제 '+(S.qi+1)+' / '+p.qs.length+'</div>';
  if(q.src)h+='<blockquote class="src"><p>'+esc(q.src)+'</p><cite>— '+esc(q.srcBy)+'</cite></blockquote>';
  if(q.fig)h+=q.fig;
  if(q.img&&q.type!=="tap")h+=imgBox(q.img,q.cap);
  if(q.imgs)h+='<div class="trio">'+q.imgs.map(function(k,i){return imgBox(k,q.left[i])}).join("")+'</div>';
  h+='<p class="task">'+esc(q.q)+'</p>';
  if(q.type==="mc"){if(!st.order){st.order=q.two?[0,1]:shuffle(q.opts.map(function(_,i){return i}));save()}
    h+='<div class="opts'+(q.two?" two":"")+'">'+st.order.map(function(k,n){var cls=S.solved&&k===q.a?" right":(st.out||[]).indexOf(k)>=0?" wrong":"";return '<button class="opt'+cls+'" data-k="'+k+'" '+(S.solved||(st.out||[]).indexOf(k)>=0?"disabled":"")+'><b>'+(q.two?"":(n+1)+".")+'</b>'+esc(q.opts[k])+'</button>'}).join("")+'</div>'}
  else if(q.type==="ox"){h+='<div class="oxs"><button class="ox o" data-v="1" '+(S.solved?"disabled":"")+'>O</button><button class="ox x" data-v="0" '+(S.solved?"disabled":"")+'>X</button></div>'}
  else if(q.type==="multi"){st.sel=st.sel||[];h+='<div class="opts">'+q.opts.map(function(o,k){var on=st.sel.indexOf(k)>=0;return '<button class="opt chk'+(on?" sel":"")+'" data-k="'+k+'" '+(S.solved?"disabled":"")+'><b>'+(on?"☑":"☐")+'</b>'+esc(o)+'</button>'}).join("")+'</div>'+(S.solved?'':'<div class="row center"><button class="btn main" id="chk">다 골랐어요</button></div>')}
  else if(q.type==="match"){st.sel=st.sel||q.left.map(function(){return -1});
    h+='<div class="match">'+q.left.map(function(l,i){return '<div class="mrow"><div class="ml">'+esc(l)+'</div><div class="mr">'+q.right.map(function(r,k){return '<button class="chip'+(st.sel[i]===k?" sel":"")+'" data-i="'+i+'" data-k="'+k+'" '+(S.solved?"disabled":"")+'>'+esc(r)+'</button>'}).join("")+'</div></div>'}).join("")+'</div>'+(S.solved?'':'<div class="row center"><button class="btn main" id="chk">짝 맞추기 확인</button></div>')}
  else if(q.type==="blanks"){var words=[];q.text.replace(/\[([^\]]+)\]/g,function(_,w){words.push(w)});st.n=st.n||0;if(S.solved)st.n=words.length;if(!st.bank){st.bank=shuffle(words.concat(q.extra));save()}
    var bi=0;h+='<div class="note-book"><div class="nb-body">'+esc(q.text).replace(/\[([^\]]+)\]/g,function(_,w){var k=bi++;return k<st.n?'<span class="blank filled">'+w+'</span>':'<span class="blank'+(k===st.n?" cur":"")+'">&nbsp;</span>'})+'</div></div>'+
     '<div class="words">'+st.bank.map(function(w,i){var used=words.slice(0,st.n).indexOf(w)>=0;return '<button class="word" data-i="'+i+'" '+(used||S.solved?"disabled":"")+'>'+esc(w)+'</button>'}).join("")+'</div>'}
  else if(q.type==="tap"){h+='<div class="tapguide"><span class="ar">▼</span><span>그림을 손가락으로 톡 눌러 보세요!</span></div>'+imgBox(q.img,q.cap,"tapbox")}
  h+='<div class="fb'+(S.solved?" good":S.tries?" bad":"")+'" id="fb">'+fbText(q)+'</div>'+(S.solved?'<div class="row end"><button class="btn main big" id="nx">'+(S.qi<p.qs.length-1?"다음 문제 →":"글자 받기 →")+'</button></div>':'')+'</div></div>'+resetRow();
  app.innerHTML=h;bind(q,st);bindReset();
}
function fbText(q){
  if(S.solved)return '<b>정답이에요!</b> '+esc(q.e);
  if(!S.tries)return "";
  if(S.tries===1)return "다시 생각해 보세요.";
  return '다시 생각해 보세요. <span class="hint">힌트 · '+esc(q.hint)+'</span>';
}
function miss(){
  S.tries++;S.wrong[S.qi]=(S.wrong[S.qi]||0)+1;save();
  var f=$("fb");if(f){f.className="fb bad";f.innerHTML=fbText(PAGES[S.page].qs[S.qi])}
  var sh=$("sh");if(sh){sh.classList.remove("shake");void sh.offsetWidth;sh.classList.add("shake")}
}
function ok(){S.solved=true;save();renderQuiz();var f=$("fb");if(f)try{f.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}}
function bind(q,st){
  var nx=$("nx");if(nx)nx.onclick=function(){var p=PAGES[S.page];if(S.qi<p.qs.length-1){S.qi++;S.tries=0;S.solved=false;S.st={};save();render()}else pageDone()};
  if(S.solved)return;
  if(q.type==="mc")each(".opt",function(b){b.onclick=function(){var k=+b.getAttribute("data-k");if(k===q.a)ok();else{st.out=(st.out||[]).concat([k]);b.disabled=true;b.classList.add("wrong");save();miss()}}});
  if(q.type==="ox")each(".ox",function(b){b.onclick=function(){if((b.getAttribute("data-v")==="1")===q.a)ok();else{b.classList.add("wrong");miss()}}});
  if(q.type==="multi"){each(".opt",function(b){b.onclick=function(){var k=+b.getAttribute("data-k"),i=st.sel.indexOf(k);if(i>=0)st.sel.splice(i,1);else st.sel.push(k);save();var on=st.sel.indexOf(k)>=0;b.classList.toggle("sel",on);b.querySelector("b").textContent=on?"☑":"☐"}});
    $("chk").onclick=function(){var a=q.a.slice().sort().join(),s=st.sel.slice().sort().join();if(a===s)ok();else miss()}}
  if(q.type==="match"){each(".chip",function(b){b.onclick=function(){var i=+b.getAttribute("data-i"),k=+b.getAttribute("data-k");st.sel[i]=k;save();each('.chip[data-i="'+i+'"]',function(c){c.classList.toggle("sel",c===b)})}});
    $("chk").onclick=function(){if(st.sel.indexOf(-1)>=0){var f=$("fb");f.className="fb";f.textContent="아직 고르지 않은 짝이 있어요.";return}if(st.sel.every(function(k,i){return k===q.a[i]}))ok();else miss()}}
  if(q.type==="blanks"){var words=[];q.text.replace(/\[([^\]]+)\]/g,function(_,w){words.push(w)});
    each(".word",function(b){b.onclick=function(){var w=st.bank[+b.getAttribute("data-i")];if(w===words[st.n]){st.n++;save();if(st.n>=words.length)ok();else renderQuiz()}else miss()}})}
  if(q.type==="tap"){var box=$("tapbox");
    box.querySelector("img").onclick=function(e){var r=box.getBoundingClientRect(),m=document.createElement("span");m.className="miss";m.style.left=(e.clientX-r.left)+"px";m.style.top=(e.clientY-r.top)+"px";box.appendChild(m);setTimeout(function(){m.remove()},700);miss()};
    q.decoys.concat([q.spot]).forEach(function(r,i,arr){var real=i===arr.length-1,b=document.createElement("button");b.className="hot";b.setAttribute("aria-label","그림 속 한 곳");
      b.style.left=r[0]+"%";b.style.top=r[1]+"%";b.style.width=r[2]+"%";b.style.height=r[3]+"%";
      b.onclick=function(e){e.stopPropagation();if(real){b.classList.add("found");setTimeout(ok,700)}else{b.classList.add("nope");b.disabled=true;miss()}};box.appendChild(b)})}
}
function pageDone(){
  S.stage="letter";save();
  modal.innerHTML='<div class="reveal" role="dialog" aria-label="글자 얻음"><div class="rv-inner"><div class="rv-lbl">다섯 문제를 모두 풀었다 · 붉은 글자를 얻었다</div><div class="rv-got">'+esc(T.l)+'</div><div class="rv-name">'+esc(S.name)+'</div><div class="rv-sub">이 글자를 기억하세요. 발표 시간에 다른 모둠의 글자와 모아 한마디를 완성합니다.</div><button class="btn main big" id="cgo">결과 보기</button></div></div>';
  $("cgo").onclick=function(){modal.innerHTML="";render()};

  app.innerHTML='<div class="fade col"><div class="lab">'+esc(S.name)+' · '+esc(p.chap)+' 완성</div><h1 class="h1">우리 모둠의 글자</h1>'+

   '<div class="card"><div class="lab">발표 준비</div>'+(mx>0?'<p>우리 모둠이 가장 헷갈린 문제: <b class="red">'+(hi+1)+'번</b> ('+mx+'번 틀림)</p><p class="soft">“'+esc(p.qs[hi].q)+'” → '+esc(p.qs[hi].e)+'</p>':'<p>한 번도 틀리지 않았어요. 가장 어려웠던 문제를 하나 골라 발표해요.</p>')+
   '<ol class="rules"><li>어려웠던 문제와 정답, 그 이유를 말한다.</li><li>마지막에 우리 모둠의 글자 <b class="red">‘'+esc(T.l)+'’</b>을(를) 외친다.</li></ol></div>'+
   '<div class="card"><div class="lab">오늘 우리 마당에서 배운 것</div><ol class="rules">'+p.qs.map(function(q){return '<li>'+esc(q.e)+'</li>'}).join("")+'</ol></div>'+
   '<div class="row"><button class="btn" id="rs">⌂ 처음으로</button></div></div>';
  $("rs").onclick=confirmReset;
}
function resetRow(){return '<div class="row end"><button class="btn" id="rs">⌂ 처음으로</button></div>'}

var GROUPS0=["오하윤, 황예린, 안태영, 고유진, 정상현","나채영, 신예겸, 장지원, 김종윤, 김민건","김규리, 윤주아, 진수빈, 김민서","유민지, 조정민, 이후승, 추승호, 김찬섭, 오태완","오성훈, 최종준, 고지운, 박지환, 최은서, 이예은"];
function tLoad(){try{var t=JSON.parse(localStorage.getItem(TKEY));if(t&&t.groups)return t}catch(e){}return null}
function tSave(t){try{localStorage.setItem(TKEY,JSON.stringify(t))}catch(e){}}
function newT(){return {k:Math.random().toString(36).slice(2,7),groups:GROUPS0.slice(),revealed:[],view:"deal",show:false}}
function baseUrl(){return /\.(netlify\.app|github\.io)$/.test(location.hostname)?location.origin+location.pathname:PUBLIC_URL}
function leaderOf(s){return String(s||"").split(/[,\s]+/).filter(Boolean)[0]||""}
function ticketUrl(t,g){var o={g:g,c:g-1,l:CODE[g-1],k:t.k},n=leaderOf(t.groups[g-1]);if(n)o.n=n;return baseUrl()+"?v="+BUILD+"&t="+enc(o)}
function ldHTML(s){var n=leaderOf(s);return '<span class="ldt">조장</span><b>'+(n?esc(n):"?")+'</b>'+TAB}
function renderTeacher(){
  var t=tLoad();if(!t){t=newT();tSave(t)}
  if(t.view==="reveal")return renderReveal(t);
  app.innerHTML='<div class="fade col wide"><div class="center"><div class="lab">조선 후기 생활과 문화 · 3학년 6반 · 선생님 화면</div><h1 class="h1">흥부전 조각 맞추기</h1><p class="soft">조장이 탭으로 자기 모둠 QR을 찍으면 시작합니다. 흥부전 한 마당을 보고 문제 다섯 개를 풀면 붉은 글자 하나를 얻습니다.</p></div>'+
   '<div class="row center"><button class="btn" id="tog">'+(t.show?"배정 숨기기":"배정 보기 (선생님만)")+'</button><button class="btn main" id="rv">발표 · 한마디 완성 화면 →</button></div>'+
   '<div class="gcards">'+[1,2,3,4,5].map(function(g){var p=PAGES[g-1];return '<div class="gcard"><div class="gh"><span class="gn">'+g+'모둠</span>'+(t.show?'<span class="gl">'+esc(p.chap)+' · <b>'+CODE[g-1]+'</b></span>':'')+'</div>'+
     '<div class="qrbox" id="qr'+g+'"></div><div class="ld" id="ld'+g+'">'+ldHTML(t.groups[g-1])+'</div>'+
     '<textarea class="gm" data-g="'+g+'" rows="2" aria-label="'+g+'모둠 모둠원 (맨 앞 이름이 조장)">'+esc(t.groups[g-1])+'</textarea></div>'}).join("")+'</div>'+
   '<p class="soft center">모둠원 칸은 눌러서 고칠 수 있고, 맨 앞 이름이 탭을 들고 오는 조장입니다. 이름을 고치면 QR도 새로 만들어집니다.</p>'+
   '<div class="row center"><button class="btn" id="newk">모든 모둠 처음부터 (새 QR)</button></div></div>';
  [1,2,3,4,5].forEach(function(g){var box=$("qr"+g);try{var cv=QRMini.canvas(ticketUrl(t,g),440);cv.setAttribute("role","img");cv.setAttribute("aria-label",g+"모둠 입장 QR");box.appendChild(cv)}catch(e){box.innerHTML='<p class="soft">QR을 그리지 못했습니다</p>'}});
  each(".gm",function(x){x.oninput=function(){var g=+x.getAttribute("data-g");t.groups[g-1]=x.value;tSave(t);$("ld"+g).innerHTML=ldHTML(x.value)};x.onchange=function(){renderTeacher()}});
  $("tog").onclick=function(){t.show=!t.show;tSave(t);renderTeacher()};
  $("rv").onclick=function(){t.view="reveal";tSave(t);renderTeacher()};
  $("newk").onclick=function(){
    modal.innerHTML='<div class="overlay"><div class="card fade"><h2>새 QR로 바꿀까요?</h2><p>모둠 탭의 진행 기록이 처음부터 다시 시작됩니다. 이미 QR을 찍었다면 새 QR을 다시 찍어야 합니다. 마당과 글자 배정은 같습니다.</p><div class="row"><button class="btn main" id="yes">새 QR 만들기</button><button class="btn" id="no">취소</button></div></div></div>';
    $("no").onclick=function(){modal.innerHTML=""};$("yes").onclick=function(){t.k=Math.random().toString(36).slice(2,7);t.revealed=[];tSave(t);modal.innerHTML="";renderTeacher()};
  };
}
function renderReveal(t){
  var rv=t.revealed||[],done=rv.length===5;
  app.innerHTML='<div class="fade col wide"><div class="center"><div class="lab">3학년 6반 · 발표 · 한마디 완성</div><h1 class="h1">다섯 글자를 모아라</h1><p class="soft">모둠이 어려웠던 문제를 발표하고 글자를 외치면, 그 모둠 버튼을 누르세요.</p></div>'+
   '<div class="slots5">'+CODE.split("").map(function(ch,i){var on=rv.indexOf(i+1)>=0;return '<div class="slot5'+(on?" on":"")+'"><span class="sg">'+(i+1)+'모둠 · '+PAGES[i].chap+'</span><span class="sl">'+(on?ch:"?")+'</span></div>'}).join("")+'</div>'+
   '<div class="row center">'+[1,2,3,4,5].map(function(g){var on=rv.indexOf(g)>=0;return '<button class="btn '+(on?"":"main")+' gbtn" data-g="'+g+'" '+(on?"disabled":"")+'>'+g+'모둠 발표 완료</button>'}).join("")+'</div>'+
   (done?'<div class="card center"><div class="lab">흥부전이 전하는 한마디</div><div class="final">착하게 살자</div><p class="lead">착한 사람은 복을 받고 나쁜 사람은 벌을 받는다 — <b class="red">권선징악(勸善懲惡)</b></p><div class="row center"><button class="btn main big" id="joy">흥부네 잔치 보기</button></div></div>':'')+
   '<div class="row center"><button class="btn" id="back">← QR 배정판으로</button><button class="btn" id="undo">발표 하나 되돌리기</button></div></div>';
  each(".gbtn",function(b){b.onclick=function(){t.revealed=(t.revealed||[]).concat([+b.getAttribute("data-g")]);tSave(t);renderReveal(t)}});
  $("back").onclick=function(){t.view="deal";tSave(t);renderTeacher()};
  $("undo").onclick=function(){t.revealed=(t.revealed||[]).slice(0,-1);tSave(t);renderReveal(t)};
  if($("joy"))$("joy").onclick=function(){
    modal.innerHTML='<div class="reveal" role="dialog" aria-label="흥부네 잔치"><div class="rv-inner"><div class="frame endf"><svg viewBox="0 0 400 400">'+ART.end(true,5)+'</svg></div><div class="final light">착하게 살자!</div><div class="rv-sub">흥부 이야기는 판소리와 한글 소설로 오늘날까지 전해지고 있어요.</div><button class="btn main big" id="cgo">닫기</button></div></div>';
    $("cgo").onclick=function(){modal.innerHTML=""};
  };
}
function render(){
  window.scrollTo(0,0);clearT();
  if(!T){document.body.classList.add("teacher");renderTeacher();return}
  if(S.stage==="intro")renderIntro();
  else if(S.stage==="movie")renderMovie();
  else if(S.stage==="quiz")renderQuiz();
  else renderLetter();
}
window.__HG=PAGES;
render();
})();
</script>
