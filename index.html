<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>흥부전 그림책 복습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 책상 위에 펼친 그림책 한 권. 왼쪽 면은 움직이는 그림, 오른쪽 면은 이야기나 복습 문제. 장을 넘기면 책장이 실제로 넘어감. 한지·오방색 단일 테마. */
:root{
  --desk:#e6d6b8; --desk-2:#d9c6a2; --paper:#fbf5e8; --paper-2:#f3e9d3; --ink:#3f332c; --ink-soft:#7a6a5c;
  --cover:#6e4128; --red:#c8443a; --blue:#2f6f9f; --yellow:#e2b33c; --green:#5d8f4e; --wood:#b98a5e;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --story:"Gowun Batang","Nanum Myeongjo",serif;
  --ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);
  background-image:repeating-linear-gradient(90deg,rgba(120,80,40,.05) 0 2px,transparent 2px 90px),radial-gradient(ellipse at 50% 40%,#efe2c8,var(--desk) 70%)}
h1,h2,p{margin:0}
.stage{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1500px;width:100%;margin:0 auto}
.brand{font-family:var(--display);font-size:clamp(20px,2vw,28px);display:flex;align-items:center;gap:10px}
.obang{display:inline-flex;height:10px;border-radius:2px;overflow:hidden}
.obang i{width:12px;height:100%}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--wood);background:transparent}
.dot.q{border-radius:3px}
.dot.done{background:var(--wood)}
.dot.now{background:var(--red);border-color:var(--red)}
.coins{font-family:var(--display);font-size:clamp(18px,1.8vw,26px);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.coins svg{width:28px;height:28px}
.coins.bump{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
.desk{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.book{position:relative;width:min(100%,calc((100vh - 150px) * 1.5));aspect-ratio:1.5;container-type:inline-size;perspective:2600px;
  background:var(--cover);border-radius:14px;padding:1.1cqi;box-sizing:border-box;box-shadow:0 18px 40px rgba(60,35,15,.35),inset 0 0 0 3px #5a3420}
.spread{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr}
.pg{position:relative;box-sizing:border-box;min-width:0;overflow:hidden;background:var(--paper);
  background-image:linear-gradient(rgba(150,110,60,.04) 1px,transparent 1px);background-size:100% 6px}
.pgL{border-radius:8px 0 0 8px;box-shadow:inset -2.4cqi 0 3cqi -2cqi rgba(90,60,30,.35),inset 0 0 0 1px #e2d3b3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqi;padding:2.4cqi 2.6cqi 3.4cqi}
.pgR{border-radius:0 8px 8px 0;box-shadow:inset 2.4cqi 0 3cqi -2cqi rgba(90,60,30,.35),inset 0 0 0 1px #e2d3b3;
  display:flex;flex-direction:column;justify-content:center;gap:1.6cqi;padding:3cqi 3.6cqi 3.6cqi 4cqi}
.folio{position:absolute;bottom:1.2cqi;font-family:var(--story);font-size:clamp(11px,1.1cqi,15px);color:var(--ink-soft)}
.pgL .folio{left:2.6cqi}.pgR .folio{right:3cqi}
/* 그림 틀: 한옥 문살 + 오방색 띠 */
.frame{position:relative;width:100%;aspect-ratio:1;box-sizing:border-box;border:1.1cqi solid #c9a77c;border-radius:4px;
  box-shadow:inset 0 0 0 2px #8f6a45,0 0 0 2px #8f6a45;background:#f4ead5;overflow:hidden}
.frame::before{content:"";position:absolute;left:0;right:0;top:0;height:1.1cqi;z-index:2;
  background:linear-gradient(90deg,#c8443a 0 16%,#e2b33c 16% 32%,#5d8f4e 32% 48%,#2f6f9f 48% 64%,#f0ebe0 64% 80%,#2b2b2b 80% 100%)}
.frame svg{display:block;width:100%;height:100%}
.cap{font-family:var(--display);font-size:clamp(14px,1.7cqi,22px);color:var(--ink);min-height:1.3em;text-align:center}
.replay{position:absolute;right:1cqi;bottom:1cqi;z-index:3;font:inherit;font-family:var(--display);font-size:clamp(12px,1.3cqi,17px);
  border:2px solid var(--ink);background:#fffdf6;color:var(--ink);border-radius:999px;padding:.3cqi 1.2cqi;cursor:pointer}
/* 오른쪽 면 글 */
.lab{font-family:var(--display);font-size:clamp(13px,1.5cqi,20px);letter-spacing:.06em;color:var(--red)}
.ttl{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.3cqi,46px);line-height:1.25;text-wrap:balance;word-break:keep-all}
.body{font-family:var(--story);font-size:clamp(15px,2.05cqi,28px);line-height:1.85;word-break:keep-all}
.body em{font-style:normal;color:var(--red);font-weight:700}
.cue{font-size:clamp(13px,1.6cqi,21px);line-height:1.6;color:var(--ink-soft);border-top:2px dashed #dccbaa;padding-top:1.2cqi;word-break:keep-all}
.qq{font-family:var(--display);font-weight:400;font-size:clamp(19px,2.75cqi,38px);line-height:1.35;text-wrap:balance;word-break:keep-all}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1cqi}
.opt{font:inherit;font-family:var(--ui);font-size:clamp(14px,1.95cqi,26px);text-align:left;line-height:1.35;word-break:keep-all;
  display:flex;gap:.8cqi;align-items:baseline;padding:1.2cqi 1.4cqi;border-radius:1cqi;border:2px solid #d8c6a3;background:var(--paper-2);color:var(--ink);cursor:pointer}
.opt b{font-family:var(--display);font-weight:400;color:var(--red);flex:none}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green);border-color:var(--green);color:#fffdf6}
.opt.right b{color:#fffdf6}
.opt.wrong{border-color:var(--red);color:var(--ink-soft);text-decoration:line-through}
.fb{font-size:clamp(14px,1.75cqi,23px);line-height:1.55;padding:1cqi 1.4cqi;border-left:.5cqi solid var(--green);background:rgba(255,255,255,.6);word-break:keep-all}
.fb.bad{border-left-color:var(--red)}
.fb:empty{display:none}
.sum{display:flex;flex-direction:column;gap:1cqi;padding:0;margin:0;list-style:none}
.sum li{font-family:var(--story);font-size:clamp(14px,1.8cqi,24px);line-height:1.6;word-break:keep-all;display:flex;gap:1cqi}
.sum li b{font-family:var(--display);font-weight:400;color:var(--red);flex:none}
.cover-t{font-family:var(--display);font-size:clamp(40px,7cqi,96px);line-height:1;letter-spacing:.04em}
footer .hint{font-size:13px;color:var(--ink-soft);margin-right:auto}
.btn{font:inherit;font-family:var(--display);font-size:clamp(16px,1.5vw,21px);padding:8px 20px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.main{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.opt:focus-visible,.replay:focus-visible{outline:3px solid var(--red);outline-offset:3px}
/* 책장 넘김 */
.ov{position:absolute;top:0;bottom:0;width:50%;z-index:5;pointer-events:none}
.ov.l{left:0}.ov.r{right:0}
.ov .pg{position:absolute;inset:0}
.sheet{position:absolute;top:0;bottom:0;width:50%;z-index:6;transform-style:preserve-3d;pointer-events:none}
.sheet.fwd{left:50%;transform-origin:left center;animation:flipF .85s cubic-bezier(.45,.05,.35,1) forwards}
.sheet.bwd{left:0;transform-origin:right center;animation:flipB .85s cubic-bezier(.45,.05,.35,1) forwards}
.sheet .pg{position:absolute;inset:0;backface-visibility:hidden}
.sheet .pg.back{transform:rotateY(180deg)}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%);opacity:0;animation:shade .85s ease forwards}
@keyframes flipF{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes flipB{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@keyframes shade{50%{opacity:1}to{opacity:0}}
@media (max-width:760px){
  .book{width:100%;aspect-ratio:auto;height:auto}
  .spread{grid-template-columns:1fr}
  .pgL,.pgR{border-radius:8px}
  .desk{align-items:flex-start;overflow:auto}
  .stage{height:auto;min-height:100%}
  .opts{grid-template-columns:1fr}
}

/* ---------- 인물 ---------- */
.fc{display:none}
.mood-neutral .f-neutral,.mood-sad .f-sad,.mood-shock .f-shock,.mood-happy .f-happy,.mood-smug .f-smug,.mood-angry .f-angry{display:inline}
.ch .whole{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:none}50%{transform:translateY(-1.6px)}}
.ch .hd{animation:nod 3.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.ch .armF{animation:armF 2.8s ease-in-out infinite}
.ch .armB{animation:armB 3.1s ease-in-out infinite}
@keyframes armF{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(3deg)}}
@keyframes armB{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-3deg)}}
/* 몸짓 */
.ch.wave .armF{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-140deg)}to{transform:rotate(-178deg)}}
.ch.point .armB{animation:point .4s ease-in-out infinite alternate}
@keyframes point{from{transform:rotate(92deg)}to{transform:rotate(110deg)}}
.ch.point .armF{animation:none;transform:rotate(-28deg)}
.ch.point .hd{animation:shout .3s ease-in-out infinite alternate}
@keyframes shout{from{transform:rotate(-4deg)}to{transform:rotate(3deg) translateY(-1px)}}
.ch.walk .lgL{animation:legA .45s ease-in-out infinite alternate}
.ch.walk .lgR{animation:legA .45s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.ch.walk .whole{animation:bob .225s ease-in-out infinite alternate}
@keyframes bob{from{transform:none}to{transform:translateY(-3px)}}
.ch.walk .hd{animation:none;transform:rotate(-7deg) translateY(2px)}
.ch.walk .armF{animation:legA .45s ease-in-out infinite alternate-reverse}
.walker{animation:walkoff 7s linear infinite}
@keyframes walkoff{0%{transform:translateX(0);opacity:1}78%{transform:translateX(-92px);opacity:1}88%,100%{transform:translateX(-110px);opacity:0}}
.ch.count .armF{animation:count .7s ease-in-out infinite alternate}
@keyframes count{from{transform:rotate(-120deg)}to{transform:rotate(-150deg)}}
.ch.rub .armF{animation:rub .35s ease-in-out infinite alternate}
@keyframes rub{from{transform:rotate(158deg)}to{transform:rotate(176deg)}}
.ch.lean .whole{animation:lean 2.2s ease-in-out infinite alternate}
@keyframes lean{from{transform:rotate(5deg)}to{transform:rotate(10deg)}}
.ch.wrap .armF{animation:wrap .32s ease-in-out infinite alternate}
@keyframes wrap{from{transform:rotate(-26deg)}to{transform:rotate(-50deg)}}
.ch.wrap .armB{animation:wrapB .32s ease-in-out infinite alternate-reverse}
@keyframes wrapB{from{transform:rotate(-30deg)}to{transform:rotate(-48deg)}}
.ch.sawR .armF{animation:sawR .32s ease-in-out infinite alternate}
@keyframes sawR{from{transform:rotate(-78deg)}to{transform:rotate(-52deg)}}
.ch.sawR .armB{animation:sawR .32s ease-in-out infinite alternate}
.ch.sawL .armB{animation:sawL .32s ease-in-out infinite alternate}
@keyframes sawL{from{transform:rotate(78deg)}to{transform:rotate(52deg)}}
.ch.sawL .armF{animation:sawL .32s ease-in-out infinite alternate}
.saw{animation:sawgo .32s ease-in-out infinite alternate}
@keyframes sawgo{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.ch.jump .whole{animation:jump .5s ease-out 3}
.ch.joy .whole{animation:jump .55s ease-out infinite}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-22px)}}
.ch.joy .armF{animation:wave .3s ease-in-out infinite alternate}
.ch.joy .armB{animation:waveB .3s ease-in-out infinite alternate}
@keyframes waveB{from{transform:rotate(140deg)}to{transform:rotate(178deg)}}
.ch.nope .hd{animation:nope .3s ease-in-out 4!important}
@keyframes nope{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.ch.fall .whole{animation:fall .55s ease-out forwards}
@keyframes fall{to{transform:translateX(12px) rotate(16deg)}}
.ch.fall .armF{animation:none;transform:rotate(-150deg)}
.ch.fall .armB{animation:none;transform:rotate(150deg)}
.ch.reach .armF{animation:reach .7s ease-out forwards}
@keyframes reach{to{transform:rotate(-82deg)}}
.enter{animation:enter 1.5s ease-out both}
@keyframes enter{from{transform:translateX(-190px)}to{transform:none}}
/* 뺨 장면 (3.6초 반복) */
.sc-s2 .wife .armB{animation:swing 3.6s ease-in infinite}
@keyframes swing{0%,16%{transform:rotate(205deg)}27%{transform:rotate(112deg)}33%{transform:rotate(122deg)}50%,84%{transform:rotate(55deg)}100%{transform:rotate(205deg)}}
.sc-s2 .wife .armF{animation:none;transform:rotate(-30deg)}
.sc-s2 .heung .hd{animation:hit 3.6s ease-out infinite}
@keyframes hit{0%,25%{transform:rotate(0)}29%{transform:rotate(-20deg)}42%,58%{transform:rotate(-11deg)}68%,92%{transform:rotate(13deg)}100%{transform:rotate(0)}}
.sc-s2 .heung .whole{animation:recoil 3.6s ease-out infinite}
@keyframes recoil{0%,25%{transform:none}30%{transform:translateX(-9px) rotate(-4deg)}48%,100%{transform:none}}
.sc-s2 .heung .armF{animation:offer 3.6s ease-in-out infinite}
@keyframes offer{0%,62%{transform:rotate(-5deg)}72%,92%{transform:rotate(-150deg)}100%{transform:rotate(-5deg)}}
.slapfx{transform-box:fill-box;transform-origin:center;animation:slapfx 3.6s ease-out infinite}
@keyframes slapfx{0%,25%{transform:scale(0) rotate(-10deg);opacity:0}30%{transform:scale(1.3) rotate(-10deg);opacity:1}42%{transform:scale(1) rotate(-10deg);opacity:1}56%,100%{transform:scale(1) rotate(-10deg);opacity:0}}
.ricefx{opacity:0;animation:rice 3.6s linear infinite}
@keyframes rice{0%,28%{opacity:0}30%,96%{opacity:1}100%{opacity:0}}
.bub2{opacity:0;animation:bub2 3.6s ease-out infinite}
@keyframes bub2{0%,64%{opacity:0}70%,94%{opacity:1}100%{opacity:0}}
.sc-q3 .wife .armB{animation:tap 1s ease-in-out infinite alternate}
@keyframes tap{from{transform:rotate(28deg)}to{transform:rotate(44deg)}}
/* 제비 */
.swal .wing{animation:flapS 1.4s ease-in-out infinite}
@keyframes flapS{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
.swal.hurt{animation:shiver 1.6s ease-in-out infinite}
@keyframes shiver{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg) translateY(1px)}}
.swal.fly .wing,.won .swal .wing{animation:flapF .2s ease-in-out infinite alternate}
@keyframes flapF{from{transform:rotate(-18deg)}to{transform:rotate(26deg)}}
.swal.circle{animation:circle 7s ease-in-out infinite}
@keyframes circle{0%,100%{transform:translate(-120px,10px)}25%{transform:translate(-20px,-18px)}50%{transform:translate(90px,0)}75%{transform:translate(-10px,16px)}}
.won .swal{animation:flyup 4.5s ease-in-out infinite}
@keyframes flyup{0%{transform:none}30%{transform:translate(-40px,-150px) rotate(-8deg)}60%{transform:translate(70px,-200px) rotate(6deg)}100%{transform:none}}
.bandwrap{transform-box:fill-box;transform-origin:center;animation:bandw .64s ease-in-out infinite}
@keyframes bandw{0%,100%{transform:scaleX(.3)}50%{transform:scaleX(1)}}
/* 박 */
.lid{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.opened .lid{transform:translate(-36px,-58px) rotate(-38deg)}
.treasure{opacity:0;transform:translateY(24px)}
.opened .treasure{animation:rise .7s .25s ease-out forwards}
@keyframes rise{to{opacity:1;transform:none}}
.opened .saw{opacity:0;animation:none}
.gob{opacity:0;transform:translateY(30px) scale(.2)}
.opened .gob{animation:gobpop .6s .2s ease-out forwards,gobbob .5s .8s ease-in-out infinite alternate}
@keyframes gobpop{to{opacity:1;transform:translateY(-40px) scale(1)}}
@keyframes gobbob{from{opacity:1;transform:translateY(-40px) scale(1)}to{opacity:1;transform:translateY(-52px) scale(1.04)}}
.sawtxt{transform-box:fill-box;transform-origin:center;animation:sawtxt .64s ease-in-out infinite}
@keyframes sawtxt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
.opened .sawtxt{opacity:0}
.pop{transform-box:fill-box;transform-origin:center bottom;animation:popc .5s ease-out both}
@keyframes popc{from{transform:translateY(-30px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.won .coinpop{animation:popc .5s ease-out both}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.cloud{animation:cloud 16s ease-in-out infinite alternate}
@keyframes cloud{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.bub{transform-box:fill-box;transform-origin:left bottom;animation:bubin .45s .3s ease-out both}
@keyframes bubin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.ov{display:none}}
</style>

</head>
<body>
<div class="stage">
  <header>
    <div class="brand"><span class="obang" aria-hidden="true"><i style="background:#c8443a"></i><i style="background:#e2b33c"></i><i style="background:#5d8f4e"></i><i style="background:#2f6f9f"></i><i style="background:#2b2b2b"></i></span>흥부전 그림책 복습</div>
    <div class="dots" id="dots" aria-label="진행 상황"></div>
    <div class="coins" id="coins"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#e2b33c" stroke="#3f332c" stroke-width="2.4"/><rect x="11" y="11" width="8" height="8" fill="#fbf5e8" stroke="#3f332c" stroke-width="2"/></svg><span id="coinN">엽전 0닢</span></div>
  </header>
  <div class="desk">
    <div class="book" id="book">
      <div class="spread" id="spread">
        <section class="pg pgL" id="L"></section>
        <section class="pg pgR" id="R"></section>
      </div>
    </div>
  </div>
  <footer>
    <span class="hint">학생들이 말한 답을 선생님이 누르세요 · 숫자 1~4로 보기 선택 · ←/→ 키로 장 넘기기</span>
    <button class="btn" id="prev" type="button">◀ 이전 장</button>
    <button class="btn" id="home" type="button">처음으로</button>
    <button class="btn main" id="next" type="button">다음 장 ▶</button>
  </footer>
</div>

<script>
const $=id=>document.getElementById(id);
const OL='stroke="#3f332c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"';
const SKIN="#f6d4b0",HAIR="#2e2624",DARK="#2b221e";

/* ---------- 얼굴 ---------- */
function faces(m=0){
  const e=x=>`<circle cx="${x}" cy="-30" r="3.4" fill="${DARK}"/>`,L=`stroke="${DARK}" stroke-width="2.6" stroke-linecap="round" fill="none"`;
  return `<g class="fc f-neutral">${e(-11)}${e(11)}<path d="M-15 -41 h7 M8 -41 h7" ${L}/><path d="M-6 ${-17+m} q6 5 12 0" ${L}/></g>
  <g class="fc f-sad">${e(-11)}${e(11)}<path d="M-17 -38 l9 -4 M8 -42 l9 4" ${L}/><path d="M-6 ${-13+m} q6 -6 12 0" ${L}/></g>
  <g class="fc f-shock"><circle cx="-11" cy="-31" r="5.2" fill="#fff" stroke="${DARK}" stroke-width="2"/><circle cx="-11" cy="-31" r="2.3" fill="${DARK}"/><circle cx="11" cy="-31" r="5.2" fill="#fff" stroke="${DARK}" stroke-width="2"/><circle cx="11" cy="-31" r="2.3" fill="${DARK}"/><path d="M-17 -44 q5 -5 10 0 M7 -44 q5 -5 10 0" ${L}/><ellipse cx="0" cy="${-15+m}" rx="5" ry="6.5" fill="#7a3328" stroke="${DARK}" stroke-width="2"/></g>
  <g class="fc f-happy"><path d="M-16 -29 q5 -7 10 0 M6 -29 q5 -7 10 0" ${L}/><path d="M-15 -42 q4 -3 8 0 M7 -42 q4 -3 8 0" ${L}/><path d="M-9 ${-20+m} q9 13 18 0Z" fill="#7a3328" stroke="${DARK}" stroke-width="2"/></g>
  <g class="fc f-smug"><path d="M-16 -30 h9 M7 -30 h9" stroke="${DARK}" stroke-width="3.2" stroke-linecap="round"/><path d="M-16 -40 l9 2 M7 -37 l9 -5" ${L}/><path d="M-7 ${-17+m} q9 4 14 -4" ${L}/></g>

            [4800,()=>{const w=root.querySelector(".heungw");w.style.opacity=1;w.classList.add("enter");root.querySelector(".heung").classList.add("reach");mood(root.querySelector(".nol"),"sad")}]]
};

  cue:"박에서 나온 보물처럼, 문제를 맞힐 때마다 엽전이 쌓여요.",cap:"흥부네 마당",replay:true},

  cue:"이 이야기는 판소리와 한글 소설로 오늘날까지 전해지고 있어요.",cap:"놀부네 박",replay:true},
 {t:"end",art:"end",cap:"흥부네 마당"}

const QN=PAGES.filter(p=>p.t==="q").length;
let cur=0,ans={},timers=[],flipping=false;
const coins=()=>Object.values(ans).filter(v=>v.ok).length;
function mood(el,m){if(!el)return;[...el.classList].filter(c=>c.startsWith("mood-")).forEach(c=>el.classList.remove(c));el.classList.add("mood-"+m)}

function leftHTML(i){const p=PAGES[i],a=ans[i];
  const svg=ART[p.art](!!(a&&a.ok),coins());
  return `<div class="frame"><svg class="scene sc-${p.art}${a&&a.ok?" won":""}" viewBox="0 0 400 400" role="img" aria-label="${p.cap||"흥부전 그림"}">${svg}</svg>
    ${p.replay?`<button class="replay" type="button">↻ 다시 보기</button>`:""}</div><div class="cap">${p.cap||""}</div><span class="folio">${i*2+1}</span>`}
function rightHTML(i){const p=PAGES[i],a=ans[i],qi=PAGES.slice(0,i+1).filter(x=>x.t==="q").length;
  if(p.t==="cover")return `<div class="lab">조선 후기 생활과 문화 · 마무리 복습</div><div class="cover-t">흥부전</div>
    <p class="body">놀부와 흥부의 이야기를 따라 책장을 넘기며 오늘 배운 내용을 다시 떠올려 봐요.</p>
    <p class="cue">이야기 다섯 마당과 복습 문제 ${QN}개가 기다리고 있어요. 문제를 맞힐 때마다 흥부네 엽전이 하나씩 늘어나요.</p><span class="folio">2</span>`;
  if(p.t==="story")return `<div class="lab">${p.lab}</div><h2 class="ttl">${p.ttl}</h2><p class="body">${p.body}</p><p class="cue">${p.cue}</p><span class="folio">${i*2+2}</span>`;
  if(p.t==="end")return `<div class="lab">이야기 끝 · 오늘의 정리</div><h2 class="ttl">흥부네 엽전 ${coins()}닢</h2>
    <ul class="sum"><li><b>하나</b><span>조선 후기 향촌 사회에 성리학적 규범이 정착하면서 큰아들이 제사를 맡고 재산을 더 물려받았어요.</span></li>
    <li><b>둘</b><span>서당이 늘고 한글 사용이 확대되면서 서민 문화가 꽃피었어요.</span></li>
    <li><b>셋</b><span>흥부와 놀부 이야기는 판소리와 한글 소설로 오늘날까지 전해졌어요.</span></li></ul>
    <p class="cue">복습 문제 ${QN}개 가운데 ${coins()}개를 맞혔어요.</p><span class="folio">${i*2+2}</span>`;
  return `<div class="lab">복습 문제 ${qi} / ${QN}</div><h2 class="qq">${p.q}</h2>
    <div class="opts">${p.o.map((t,k)=>`<button class="opt${a?(k===p.a?" right":(k===a.pick?" wrong":"")):""}" type="button" data-k="${k}" ${a?"disabled":""}><b>${"①②③④"[k]}</b>${t}</button>`).join("")}</div>
    <div class="fb${a&&!a.ok?" bad":""}">${a?(a.ok?"정답이에요! ":`아쉬워요. 정답은 ${"①②③④"[p.a]}번이에요. `)+p.e:""}</div><span class="folio">${i*2+2}</span>`}

function render(){
  timers.forEach(clearTimeout);timers=[];
  $("L").innerHTML=leftHTML(cur);$("R").innerHTML=rightHTML(cur);
  wire();chrome();
  const p=PAGES[cur];if(TL[p.art])runTL(p.art);
}
function runTL(key){const root=$("L").querySelector(".scene");TL[key](root).forEach(([ms,fn])=>timers.push(setTimeout(fn,ms)))}
function wire(){
  $("R").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  const rp=$("L").querySelector(".replay");if(rp)rp.addEventListener("click",()=>{timers.forEach(clearTimeout);timers=[];$("L").innerHTML=leftHTML(cur);wire();runTL(PAGES[cur].art)});
}
function answer(k){const p=PAGES[cur];if(ans[cur])return;const ok=k===p.a;ans[cur]={pick:k,ok};
  $("R").innerHTML=rightHTML(cur);
  const sc=$("L").querySelector(".scene"),h=sc.querySelector(".heung");
  if(ok){sc.classList.add("won");
    if(p.art==="q56"){const n=coins();sc.querySelector("g[transform^='translate(330 368)']")?.remove();sc.insertAdjacentHTML("beforeend",`<g class="coinpop">${coinPile(330,368,n*2)}</g>`)}
    if(p.art==="q4"){sc.outerHTML;$("L").innerHTML=leftHTML(cur);wire()}
    const hh=$("L").querySelector(".heung");mood(hh,"happy");hh.classList.remove("rub");hh.classList.add("jump");setTimeout(()=>hh.classList.remove("jump"),1600);
    const c=$("coins");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
  }else{mood(h,"sad");h.classList.add("nope");setTimeout(()=>h.classList.remove("nope"),1400)}
  chrome();$("next").focus();
}
function chrome(){
  $("coinN").textContent=`엽전 ${coins()}닢`;
  $("dots").innerHTML=PAGES.map((p,i)=>`<span class="dot${p.t==="q"?" q":""}${i<cur?" done":""}${i===cur?" now":""}" title="${i+1}"></span>`).join("");
  $("prev").disabled=cur===0;
  const p=PAGES[cur];$("next").disabled=cur===PAGES.length-1||(p.t==="q"&&!ans[cur]);
  $("next").textContent=p.t==="cover"?"책 펼치기 ▶":"다음 장 ▶";
}
function go(n){
  if(flipping||n<0||n>=PAGES.length||n===cur)return;
  const fwd=n>cur,oldL=$("L").innerHTML,oldR=$("R").innerHTML;
  cur=n;render();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,narrow=matchMedia("(max-width:760px)").matches;
  if(reduce||narrow)return;
  flipping=true;const sp=$("spread");
  const ov=document.createElement("div");ov.className="ov "+(fwd?"l":"r");ov.innerHTML=`<section class="pg ${fwd?"pgL":"pgR"}">${fwd?oldL:oldR}</section>`;
  const sh=document.createElement("div");sh.className="sheet "+(fwd?"fwd":"bwd");
  sh.innerHTML=fwd?`<section class="pg pgR">${oldR}</section><section class="pg pgL back">${$("L").innerHTML}</section>`
                  :`<section class="pg pgL">${oldL}</section><section class="pg pgR back">${$("R").innerHTML}</section>`;
  sp.append(ov,sh);
  setTimeout(()=>{ov.remove();sh.remove();flipping=false},880);
}
$("next").addEventListener("click",()=>go(cur+1));
$("prev").addEventListener("click",()=>go(cur-1));
$("home").addEventListener("click",()=>{ans={};cur=0;render()});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"&&!$("next").disabled){e.preventDefault();go(cur+1)}
  else if(e.key==="ArrowLeft"&&!$("prev").disabled){e.preventDefault();go(cur-1)}
  else{const n="1234".indexOf(e.key);if(n>=0){const b=$("R").querySelector(`.opt[data-k="${n}"]`);if(b&&!b.disabled)b.click()}}
});
render();
</script>
